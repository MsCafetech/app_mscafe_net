const CSS = `
:root{
  --bg:#F1F5F3;--surface:#FFFFFF;--tint:#E4ECE9;--ink:#13231F;--muted:#56675F;--line:#D3DDD9;
  --deep:#0F3A34;--deep-2:#16504A;--on-deep:#EAF4F1;--on-deep-muted:#A8C4BD;
  --mask:#F28A1E;--mask-ink:#4A2400;--ok:#2E6BE6;--ng:#DE3F2E;--warn:#E3AE00;
  --paper:#FFFFFF;--paper-ink:#1D2A27;--paper-line:#D5DDDA;
  --f-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}

:root[data-theme="dark"]{${DARK}color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--f-body);line-break:strict;overflow-wrap:anywhere}
h1,h2,h3,h4,p,dl,dd,ol,ul{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ok);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:20px}
.nb{display:inline-block}
.hero{position:relative;background:linear-gradient(160deg,var(--deep),var(--deep-2));color:var(--on-deep);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 70%);mask-image:linear-gradient(90deg,transparent 5%,#000 70%)}
.hero .wrap{position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font:900 21px/1 var(--f-display);text-decoration:none;color:var(--on-deep)}
.brand-ico{display:block;width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
.brand .tld{font:700 17px/1 var(--f-mono);color:var(--mask);margin-left:-6px}
.nav ul{display:flex;gap:6px 18px;list-style:none;padding:0;flex-wrap:wrap;font-size:14px}
.nav ul a{color:var(--on-deep-muted);text-decoration:none;padding:4px 0}
.nav ul a:hover{color:var(--on-deep)}
.hero-copy{padding-block:36px 72px}
.tag{font:500 12px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-deep-muted)}
h1{font:900 clamp(34px,6vw,60px)/1.2 var(--f-display);margin:14px 0 20px;text-wrap:balance}
h1 .hl,.pn-h .hl{background:var(--mask);color:var(--mask-ink);padding:0 .14em;border-radius:.16em}
.lead{max-width:34em;font-size:17px;opacity:.92}
.sec{padding-block:64px 8px;scroll-margin-top:8px}
.sec:last-of-type{padding-block-end:84px}
h2{font:900 clamp(26px,4vw,38px)/1.3 var(--f-display);text-wrap:balance}
.sec-lead{margin-top:10px;color:var(--muted);max-width:36em}
.app-links{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px}
.app-links>span{flex-basis:100%}
.app-links a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--mask);text-underline-offset:4px;white-space:nowrap}
.sec-head{margin-bottom:28px}
.accs{display:grid;gap:16px}
.acc{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;scroll-margin-top:12px;transition:border-color .2s}
.acc.open{border-color:var(--mask)}
.acc-hd{margin:0}
.acc-h{width:100%;appearance:none;background:none;border:0;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;padding:18px 22px}
.acc-h:hover .acc-name{color:var(--mask)}
.ico svg{display:block;border-radius:22%}
.acc-name{display:block;font:900 22px/1.3 var(--f-display);transition:color .2s}
.flag{display:inline-block;vertical-align:middle;margin-left:10px;padding:2px 10px;border-radius:999px;background:var(--ng);color:#fff;font:700 12px/1.6 var(--f-body);white-space:nowrap}
.pn-flag{display:grid;gap:4px;padding:14px 18px;border:2px solid var(--ng);border-radius:16px;background:color-mix(in srgb,var(--ng) 10%,var(--surface))}
.pn-flag b{color:var(--ng);font:900 17px/1.4 var(--f-display)}
.pn-flag span{font-size:14px;line-height:1.7}
.acc-one{display:block;color:var(--muted);font-size:14px;line-height:1.6;margin-top:2px}
.st{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.04em;padding:6px 9px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted);margin-top:8px}
.chev{width:30px;height:30px;transition:transform .3s;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.acc.open .chev{transform:rotate(180deg)}
.acc-p{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .38s ease,visibility 0s .38s}
.acc.open .acc-p{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .38s ease,visibility 0s}
.acc-in{overflow:hidden;min-height:0}
.pn{border-top:1px solid var(--line);padding:30px 22px 34px;display:grid;gap:44px}
@media (max-width:560px){.acc-h{padding:16px 16px;gap:12px}.pn{padding-inline:16px}}
.pn-top{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:36px;align-items:center}
@media (max-width:880px){.pn-top{grid-template-columns:minmax(0,1fr)}}
.pn-h{font:900 clamp(26px,4.2vw,40px)/1.28 var(--f-display);text-wrap:balance}
.pn-lead{margin-top:14px;color:var(--muted);max-width:32em;font-size:16.5px}
.pn-os{margin-top:18px;font:500 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.cta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;font:700 15px/1 var(--f-body);padding:14px 22px;border-radius:12px;text-decoration:none;border:2px solid transparent}
.btn-main{background:var(--mask);color:var(--mask-ink)}
.btn-store{gap:10px;padding:10px 20px 10px 16px}.btn-store .and{width:28px;height:28px;fill:currentColor;flex:none}.btn-store span{display:grid;gap:3px}.btn-store small{font:500 11px/1 var(--f-body);opacity:.8}
.btn-off{border:2px dashed var(--line);color:var(--muted)}
.tester{margin-top:22px;padding:16px 18px;border:1.5px dashed var(--mask);border-radius:16px;background:var(--tint);display:grid;gap:8px;justify-items:start}
.tester-h{font:900 16px/1.4 var(--f-display)}
.tester-p{color:var(--muted);font-size:14px;line-height:1.7}
.tester-n{color:var(--muted);font-size:12.5px;line-height:1.6}
.bugs{margin-top:22px;display:grid;gap:10px}
.bug-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bug-row b{flex:1 1 140px;font-size:14px}
.tester-l{margin:0;padding-left:1.3em;color:var(--muted);font-size:14px;line-height:1.7;display:grid;gap:2px}
.recruit-apps{display:flex;flex-wrap:wrap;gap:10px}
.ra{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.ra:hover{border-color:var(--mask)}

      [L('読んで答える', 'Read and answer'), L('ニュースの背景を読んで、4つの選択肢から答えを選び、「回答する」。', 'Read the background of the news, choose one of four answers and press “Answer”.')],

    info: [[L('アプリ名', 'App name'), L('時事Q', '時事Q (JijiQ)')], [L('対象', 'For'), L('学生（日々の学習向け）', 'Students (for everyday learning)')],
        [L('対応OS', 'OS'), L('Android 8.0 以上 ／ iOS 15.0 以上（予定）。スマホ・タブレット、縦・横', 'Android 8.0 or later / iOS 15.0 or later (planned). Phones and tablets, portrait or landscape')],

        [L('外部との通信', 'External connections'), L('問題データの取得（本サイトのサーバー）、写真の表示（掲載元）、広告の表示（Google AdMob）、不具合の調査・利用状況の分析（Firebase）、間違い連絡の送信（送るときだけ）。',

    note: L('開発中のため、内容は変わることがあります。問題はニュースや資料をもとに作っていますが、誤りがあることや、その後の動きで内容が古くなることがあります。気づいたときは、アプリの「間違い連絡」からお知らせください。',

  {
    id: 'furush', name: 'FuRUSH', icon: frIcon, status: L('クローズドテスト中 ／ テスター募集中', 'In closed testing / Testers wanted'), tester: TESTER_FORM_URL, test: TEST_URL_FR,
    one: L('答えが一瞬だけ出るフラッシュカードで、年号や化学式を考える前に答えが出るまで刻む暗記アプリ。', 'A memorization app with flashcards that show the answer for just an instant, drilling dates and chemical formulas until the answer comes before you think.'),
    headline: L('<span class="nb">脳に刻め。</span><span class="nb"><span class="hl">脊髄</span>に刻め。</span>', '<span class="nb">Carve it into your brain.</span> <span class="nb">Into your <span class="hl">spine</span>.</span>'),
    lead: L('こんなレベルは、知識じゃない。年号・化学式・山手線・国旗・地図などを、答えが一瞬だけ出るフラッシュカードで、考える前に答えが出るまで繰り返します。THINK LESS. KNOW INSTANTLY. ただいま Android 版のクローズドテスト中です。モードは全部で14、いまは社会の略語・日本地図・日本の地形・化学式の4つが使えます（ほかは仕込み中）。本サイトでの画面と、実際に動作させたときの画面詳細は異なります。',
        'At this level, it is not knowledge anymore. Dates, chemical formulas, the Yamanote Line, flags, maps and more, on flashcards that show the answer for just an instant, repeated until the answer comes before you think. THINK LESS. KNOW INSTANTLY. The Android version is now in closed testing. There are 14 modes in all; four are available now: social studies abbreviations, the map of Japan, Japanese landforms and chemical formulas (the rest are on the way). The screens on this site differ in detail from the real app.'),
    os: L('対応OS　Android 8.0 以上 ／ iOS（開発中）　　料金　無料（広告あり）', 'OS: Android 8.0 or later / iOS (in development)　　Price: Free (with ads)'), store: { label: L('クローズドテスト中', 'In closed testing'), url: '' },
    demo: frDemo, init: initFr,
    features: [
      [ILL.frFlash, L('答えは一瞬だけ', 'The answer flashes by'), L('？をタップすると、答えが設定した秒数（0.1\u301C2.0秒）だけ出て、すぐ次のカードへ。カードは上へ消えて、下から次が出ます。', 'Tap ? and the answer appears for the time you set (0.1\u20132.0 seconds), then it is straight on to the next card. Cards slide away upward as the next one rises from below.')],
      [ILL.frModes, L('全部で14のモード', '14 modes in all'), L('日本史年号、世界史年号、化学式、化学反応式、JR山手線、世界の国旗、世界地図、日本地図、日本の地形、天体・星座、社会の略語、地図記号、物理の名称、英語活用。カードは合わせて約2,200枚。モードは配信するので、あとから増やせます。',
          'Japanese history dates, world history dates, chemical formulas, chemical equations, the JR Yamanote Line, world flags, the world map, the map of Japan, Japanese landforms, celestial bodies and constellations, social studies abbreviations, map symbols, physics terms and English verb forms. About 2,200 cards in all. Modes are delivered online, so more can be added later.')],
      [ILL.frPic, L('絵つきの問題と答え', 'Questions and answers with pictures'), L('国旗・地図・駅名標・分子模型・星座・地図記号などの絵が、問題や答えに出ます。', 'Pictures of flags, maps, station signs, molecular models, constellations, map symbols and more appear in questions and answers.')],
      [ILL.frRev, L('リバース', 'Reverse'), L('モードごとにオン／オフ。問題と答えを入れ替えて、答えから問題を思い出す練習ができます。絵は答えの側に出ます。', 'On or off for each mode. Swap questions and answers to practice recalling the question from the answer. Pictures appear on the answer side.')],
      [ILL.frFilter, L('出るカードを絞る', 'Choose which cards appear'), L('時代・種類・地域・単元などで、出るカードを絞れます。ホームのタイルには、枚数と何回目かが出ます。', 'Narrow down cards by era, type, region, unit and more. Tiles on Home show the number of cards and how many rounds you have done.')],
      [ILL.frLoop, L('無限ループ・オート・ランダム', 'Endless loop, auto and shuffle'), L('モードごとにオン／オフ。オートにすると？を自動でタップして、手を離したまま次々にめくれます。ランダムを切ると、山手線のように順番どおりに出せます。最後まで進むと「1周クリア！」です。', 'On or off for each mode. With auto on, ? is tapped for you so cards keep flipping hands-free. Turn shuffle off to go in order, like stations on the Yamanote Line. Reach the end and you get “Round clear!”.')],
      [ILL.frColor, L('6色とダーク／ライト', '6 colors, dark or light'), L('赤・オレンジ・黄・緑・青・紫の6色から選べて、明るさは端末に合わせる・ダーク・ライトから。縦向きにも横向きにも対応します。オプションで、答えの読み上げ・ヒント・バイブも切り替えられます。', 'Choose red, orange, yellow, green, blue or purple, and follow the device, dark or light. Works in portrait and landscape. Options let you turn answer read-aloud, hints and vibration on or off.')],
      [ILL.cache, L('ダウンロードして電波なしで', 'Download once, use offline'), L('一度ダウンロードしたモードは、電波がなくても使えます。ホームで下に引っぱると更新を確認して、変わった部分だけをダウンロードします。', 'Modes you have downloaded work without a signal. Pull down on Home to check for updates and download only what has changed.')],
    ],
    steps: [
      [L('モードを選ぶ', 'Pick a mode'), L('ホームのタイルから、覚えたいモードを選びます。未ダウンロードのモードは、先にダウンロードします。', 'Choose the mode you want to learn from the tiles on Home. Modes not yet downloaded are downloaded first.')],
      [L('？をタップ', 'Tap ?'), L('答えが一瞬だけ出て、次のカードへ。表示時間は下のスライダーで変えられます。', 'The answer flashes, then the next card comes. Change how long it is shown with the slider below.')],
      [L('1周クリア', 'Round clear'), L('最後のカードまで進むと「1周クリア！」。そのまま、もう1周もできます。', 'Reach the last card for “Round clear!”, then go around again if you like.')],
    ],
    info: [[L('アプリ名', 'App name'), 'FuRUSH'], [L('対応OS', 'OS'), L('Android 8.0 以上 ／ iOS（開発中）', 'Android 8.0 or later / iOS (in development)')], [L('料金', 'Price'), L('無料（広告あり）', 'Free (with ads)')], [L('配布', 'Available on'), L('Google Play（クローズドテスト中）', 'Google Play (closed testing)')], [L('モード', 'Modes'), L('全14モード（クローズドテストで使えるのは4モード）', '14 modes (4 available in closed testing)')], [L('データ', 'Data'), L('問題データは、店長が用意しています。', 'The question data is prepared by the Manager.')]],
    note: L('クローズドテスト中のため、内容は変わることがあります。デモの問題は例で、実際のアプリとは異なります。', 'The app is in closed testing, so details may change. The demo questions are only examples and differ from the real app.'),
  },
  {
    id: 'pdf-marker', name: L('PDF暗記マーカー', 'PDF Memorization Marker'), icon: pdfIcon, status: L('リリース ／ Android版', 'Released / Android'),
    one: L('問題集PDFの答えをマスクして、タップで確かめる暗記アプリ。現役東大生監修。', 'A study app that masks the answers in your workbook PDFs so you can check them with a tap. Supervised by a current University of Tokyo student.'),
    headline: L('<span class="nb"><span class="hl">答え</span>を隠して、</span><span class="nb">タップで確かめる。</span>', '<span class="nb">Hide the <span class="hl">answers</span>,</span> <span class="nb">check with a tap.</span>'),
    lead: L('お手持ちの問題集PDFが、そのまま自分専用の暗記帳になります。答えにマスクをかけてタップで見え隠れ。ハイライト・書き込み・チェック・栞から、見直したいページだけの印刷まで、勉強に要るものをひとつのアプリにそろえました。紙の問題集も、写真から PDF にできます。本サイトでの画面と、実際に動作させたときの画面詳細は異なります。', 'The workbook PDFs you already have become your own flashcard books. Mask the answers and show or hide them with a tap. From highlights, handwriting, checks and bookmarks to printing just the pages you want to review, everything you need for studying is in one app. Paper workbooks can be turned into PDFs from photos, too. The screens on this site differ in detail from the real app.'),
    os: L('対応OS　Android 8.0 以上 ／ iOS（未開発）　　料金　無料（広告あり）', 'OS: Android 8.0 or later / iOS (not developed yet)　　Price: Free (with ads)'), store: { label: L('Google Play で公開（リンクは近日掲載）', 'On Google Play (link coming soon)'), url: STORE_URL_PDF },
    demo: pdfDemo, init: initPdf,
    features: [
      [ILL.mask, L('答えをマスクで隠す', 'Hide answers with masks'), L('マスキングモードで、隠したい所を指でなぞるとマスクができます。色はコーラル・ネイビー・ブルー・ミント・ピンクの5色。まとめて削除もできます。', 'In masking mode, trace over what you want to hide to make a mask. Choose from five colors: coral, navy, blue, mint and pink. You can also delete masks all at once.')],
      [ILL.tap, L('タップで表示・非表示', 'Show or hide with a tap'), L('マスクをタップするたびに答えが見え隠れします。自分で答えてから確かめる、を何度でも。', 'Each tap on a mask shows or hides the answer. Answer first, then check, as many times as you like.')],
      [ILL.marks, L('チェックで学習を記録', 'Track your study with checks'), L('長押しで青、ダブルタップで赤、上スワイプで黄色のチェック。チェックはタップで消せます。「次の青／次の赤／次の黄」で、チェックのあるページへ順に移動できます。', 'Long press for a blue check, double tap for red and swipe up for yellow. Tap a check to remove it. “Next blue / red / yellow” jumps to the pages with checks in order.')],
      [ILL.highlight, L('ハイライトを引く', 'Highlight'), L('ハイライトモードで、イエロー・ピンク・ミントの3色から選んで、なぞった通りに線を引けます。引いた線はタップで消せます。', 'In highlight mode, pick yellow, pink or mint and draw lines exactly where you trace. Tap a line to remove it.')],
      [ILL.doodle, L('落書きで書き込む', 'Write and doodle'), L('落書きモードで、5色のペンで自由に書き込めます。消しゴムを選ぶと、なぞった所だけ消せます。', 'In doodle mode, write freely with pens in five colors. The eraser removes only what you trace over.')],
      [ILL.bookmark, L('栞で続きから', 'Pick up where you left off'), L('今のページに栞を挟めます（1つのPDFに1つ）。次に開いたとき、「栞から再開」か「最初から」を選べます。一覧にも栞のページが出ます。', 'Put a bookmark in the current page (one per PDF). Next time, choose “Resume from bookmark” or “From the start”. The list also shows the bookmarked page.')],
      [ILL.print, L('チェックしたページを印刷', 'Print checked pages'), L('すべてのページか、赤・青・黄のチェックがあるページを選んで印刷できます。マスク・チェック・ハイライト・落書きを含めるか、カラー／白黒、用紙サイズ（A3・B4・A4・B5・A5）も選べます。', 'Print all pages, or only the pages with red, blue or yellow checks. You can choose whether to include masks, checks, highlights and doodles, color or black and white, and paper size (A3, B4, A4, B5 or A5).')],
      [ILL.photo, L('写真から問題集を作る', 'Make a workbook from photos'), L('紙の問題集を撮影するか、ギャラリーから選んで、A4のページにしていきます（最大25ページ）。保存すると Download フォルダに PDF ができ、一覧にも追加されます。', 'Take photos of a paper workbook or pick them from your gallery to make A4 pages (up to 25). When you save, a PDF is created in the Download folder and added to the list.')],
      [ILL.swipe, L('スワイプとピンチで見やすく', 'Swipe and pinch'), L('左右のスワイプで1ページずつ切り替え。下のスライダーなら、離れたページへもすぐ移れます（動かしている間は行き先のページの見本が出ます）。ピンチで最大5倍まで拡大し、拡大中は指で動かせます。マスクはPDF上の座標で記録するので、拡大や画面の回転をしてもズレません。', 'Swipe left or right to turn pages one at a time. The slider at the bottom takes you straight to pages far away, showing a preview of where you will land while you drag. Pinch to zoom up to 5×, and drag while zoomed. Masks are saved by their position in the PDF, so they stay put when you zoom or rotate.')],
      [ILL.translate, L('英文を簡易翻訳', 'Quick English translation'), L('簡易翻訳モードで、訳したい英文の範囲を指でなぞると日本語訳が出ます。読み取りも翻訳も端末内で行うので、最初に翻訳データをダウンロードすれば、オフラインでも使えます。簡易的な翻訳のため、誤訳がある場合があります。', 'In quick translation mode, trace over English text to see a Japanese translation. Reading and translation happen on the device, so after downloading the translation data once, it works offline. As a simple translation, it may contain mistakes.')],
      [ILL.bgm, L('BGMを流しながら勉強', 'Study with background music'), L('ホームの歯車（オプション）でサウンドをONにすると、PDFを見ている間BGMが繰り返し流れます。曲はデフォルトのジャズか、端末にある好きな曲（MP3・M4A・WAV など）を1曲選べます。最初はOFFなので、教室や図書館でもいきなり鳴りません。閲覧画面のメニューからもON/OFFできます。', 'Turn on Sound in Options (the gear on Home) and music loops while you view a PDF. Use the default jazz track or pick one song of your own (MP3, M4A, WAV and more). Sound is off at first, so it never starts playing suddenly in class or the library. You can also switch it on or off from the menu on the PDF screen.')],
      [ILL.layers, L('元のPDFは書き換えない', 'Your original PDF stays untouched'), L('マスク・チェック・ハイライト・落書きは、PDFの上に重ねて表示するだけ。元のファイルには手を加えません。記録はPDFごとに保存され、メニューから種類ごとにまとめて消すこともできます。', 'Masks, checks, highlights and doodles are only shown on top of the PDF. The original file is never changed. Records are saved for each PDF, and you can clear each kind all at once from the menu.')],
    ],
    steps: [
      [L('PDFを追加する', 'Add a PDF'), L('一覧の「＋」から問題集のPDFを選びます。「写真から問題集を作る」で、紙の問題集から作ることもできます。登録は10個までです。PDFのコピーは作らず、元のファイルはそのままです。', 'Pick a workbook PDF with “+” in the list, or make one from a paper workbook with “Make a workbook from photos”. Up to 10 PDFs. No copy is made; the original file stays as it is.')],
      [L('答えにマスクをかける', 'Mask the answers'), L('マスキングモードで、答えの上を指でなぞってマスクを作ります。あとから移動やサイズ変更、色の変更もできます。', 'In masking mode, trace over the answers to make masks. You can move, resize and recolor them later.')],
      [L('タップして確かめる', 'Tap to check'), L('マスクをタップして答えを確認。できた問題、間違えた問題をチェックで残せます。', 'Tap a mask to check the answer. Mark questions you got right or wrong with checks.'), `<div class="marks"><span>${badge('ok')}${L('長押し', 'Long press')}</span><span>${badge('ng')}${L('ダブルタップ', 'Double tap')}</span><span>${badge('warn')}${L('上スワイプ', 'Swipe up')}</span></div>`],
    ],
    info: [[L('アプリ名', 'App name'), L('PDF暗記マーカー', 'PDF Memorization Marker')], [L('監修', 'Supervised by'), L('現役東大生', 'A current University of Tokyo student')], [L('対応OS', 'OS'), L('Android 8.0 以上 ／ iOS（未開発）', 'Android 8.0 or later / iOS (not developed yet)')], [L('料金', 'Price'), L('無料（広告あり）', 'Free (with ads)')], [L('配布', 'Available on'), L('Google Play（Android版）', 'Google Play (Android)')], [L('サウンド', 'Sound'), L('閲覧中のBGM（最初はOFF）。デフォルトの曲か、好きな曲を1曲選べます。', 'Background music while viewing (off at first). Use the default song or pick one of your own.')], [L('保存', 'Storage'), L('マスク・チェック・ハイライト・落書き・栞はPDFごとに記録します。PDFファイルのコピーは作りません。',
        'Masks, checks, highlights, doodles and bookmarks are saved for each PDF. No copies of PDF files are made.')], [L('操作説明', 'How-to'), L('初回に動く絵で説明します。PDFを開いた画面のメニュー（\u2630）から、いつでも見直せます。', 'Animated guides are shown the first time. You can see them again any time from the menu (\u2630) on the PDF screen.')]],
  },
  {
    id: 'mp3-convert', name: L('MP3変換', 'MP3 Converter'), icon: m2aIcon, status: L('クローズドテスト中 ／ テスター募集中', 'In closed testing / Testers wanted'), tester: TESTER_FORM_URL, test: TEST_URL_M2A,
    one: L('動画から音声だけを取り出して、MP3・AAC(M4A)・WAV に変換する Android アプリ。広告はあっても邪魔にならず、広告を見ながら手軽に変換。', 'An Android app that takes just the audio from a video and converts it to MP3, AAC (M4A) or WAV. The ads stay out of your way, so you can convert with ease while they sit quietly on screen.'),
    headline: L('<span class="nb">動画の音だけ、</span><span class="nb"><span class="hl">手軽に</span>MP3に。</span>', '<span class="nb">Just the sound,</span> <span class="nb"><span class="hl">easily</span> to MP3.</span>'),
    lead: L('コーヒーを一杯淹れるくらいの手軽さで、動画から音声だけを取り出します。動画を選んで、形式と音質を決めて、ボタンをひとつ押すだけ。MP3・AAC(M4A)・WAV に変換できます。広告は画面の上の決まった枠にだけ出して、操作の邪魔をしません。広告を眺めながら、手軽に変換できます。変換は端末の中だけで行い、動画や音声をサーバーへ送りません。ただいまクローズドテスト中です。本サイトでの画面と、実際に動作させたときの画面詳細は異なります。',
        'As easy as making a cup of coffee: take just the audio out of a video. Choose a video, pick a format and quality, and press one button to convert it to MP3, AAC (M4A) or WAV. Ads appear only in a fixed frame at the top of the screen and never get in the way, so you can convert with ease while they sit quietly on screen. Everything happens on your device; videos and audio are never sent to a server. Now in closed testing. The screens on this site differ in detail from the real app.'),
    os: L('対応OS　Android 10 以上　　料金　無料（広告あり）', 'OS: Android 10 or later　　Price: Free (with ads)'), store: { label: L('クローズドテスト中', 'In closed testing'), url: '' },
    demo: m2aDemo, init: initM2a,
    features: [

function initPdf(root) {
  const setMark = (btn, k) => {
    const q = btn.closest('.q'), mk = q ? $('.mk', q) : btn.nextElementSibling;
    if (btn.dataset.mk === k) { delete btn.dataset.mk; mk.innerHTML = ''; return; }
    btn.dataset.mk = k; mk.innerHTML = badge(k);
  };
  $$('.mask', root).forEach(btn => {
    let timer = 0, long = false, swiped = false, sx = 0, sy = 0, last = 0;
    const toggle = () => btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    btn.addEventListener('pointerdown', e => { long = swiped = false; sx = e.clientX; sy = e.clientY; timer = setTimeout(() => { long = true; setMark(btn, 'ok'); }, 500); });
    btn.addEventListener('pointermove', e => {
      if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clearTimeout(timer);
      if (!swiped && sy - e.clientY > 36 && Math.abs(e.clientX - sx) < 40) { swiped = true; setMark(btn, 'warn'); }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => btn.addEventListener(t, () => clearTimeout(timer)));
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('click', () => {
      if (long || swiped) { long = swiped = false; return; }
      const now = Date.now(); toggle();
      if (now - last < 320) setMark(btn, 'ng');
      last = now;
    });
  });
  autoDemo(root);
}
function autoDemo(root) {

  let token = 0, active = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const place = (x, y, ms) => { af.style.transition = `transform ${ms}ms cubic-bezier(.4,0,.2,1),opacity .3s`; af.style.transform = `translate(${x - 20}px,${y - 20}px)`; };

    'RAY の記録（進み具合、敵の強さ、累計撃破数、強化、解放したビーム、最高 WAVE など）は、端末内に保存し、店長には送信しません。端末の Android のバックアップ機能（Google のバックアップ）が有効な場合は、利用者の Google アカウントのバックアップに含まれ、機種変更のときに新しい端末へ移せます。バックアップは Google が利用者のアカウントで管理するもので、店長は見ることも受け取ることもできません。',

    'If Android’s backup feature (Google backup) is turned on for your device, BOMBOM’s play history is included in your Google Account backup and can be moved to a new device when you switch devices. The backup is managed by Google in your account; the Manager can neither view nor receive it. Only the play history is included in the backup, not ad or Firebase data.',
    'MP3 Converter connects to the network only to show ads and to check ad consent (Google AdMob and Google’s User Messaging Platform). It does not use Firebase or any other usage analytics or crash reporting.',
    'RAY’s records (progress, enemy strength, total kills, upgrades, unlocked beams, best wave, etc.) are stored on your device and are not sent to the Manager. If Android’s backup feature (Google backup) is turned on for your device, they are included in your Google Account backup and can be moved to a new device when you switch devices. The backup is managed by Google in your account; the Manager can neither see nor receive it.',
    'RAY connects to the network only to show ads and check ad consent (Google AdMob and Google’s User Messaging Platform) and for bug reports and usage analytics (Firebase Crashlytics / Analytics).',
    'JijiQ’s records (answer history, accuracy and favorites) and settings (such as the theme color) are stored on your device and are not sent to the Manager. You can erase your answer history (answers, accuracy and learning history) with “Reset answer data” in the app’s options (favorites and settings are kept). '
      + 'On Android, if the device’s Android backup (Google backup) is turned on, these records and settings are included in the backup of your Google account. The backup is managed by Google under your account, and the Manager can neither see nor receive it.',
    'JijiQ downloads question, related-knowledge and photo information (learning data) from the server of this website (app.mscafe.net): at first launch, when you choose “Update” under “Update learning data”, after “Reset answer data”, and in automatic updates about once a day run by the device (WorkManager on Android, background refresh on iOS). '
      + 'It also checks only whether new data is available at startup and every hour while the app is running (a light request that reads only the list of learning data). '
      + 'At that time, your IP address and the information needed for the connection (including the app version) are sent to this website’s server and, like this website’s access logs, are recorded by the hosting provider and kept for about 90 days.',
    'JijiQ loads photos directly from their sources’ servers (such as Wikimedia Commons) and keeps them temporarily on your device (cache). When loading them, your IP address and the information needed for the connection are sent to those sources.',
    'JijiQ’s “Report a mistake” sends three items, the question number, the version of the question data and the reason you chose (answer, question, explanation or other), to the Manager’s reception service (which runs on services of Cloudflare, Inc.), only when you choose a reason and press “Send”. No name, email address, free text or device identifier is sent. '
      + 'To prevent excessive sending, the reception service uses the sender’s IP address to check how many reports are sent. The Manager handles the reports to check and fix questions. Reports are never re-sent automatically.',
    'JijiQ uses Firebase (Crashlytics / Analytics) to investigate bugs and improve the app. No user ID is set, and device identifiers such as the advertising ID are not collected. What is sent is crash information and usage such as screens viewed, answers (question number, subject, right or wrong, and difficulty), filter settings, and the results of mistake reports and data updates.',
    'Background music in PDF Memorization Marker is played on your device. For a song you choose, the app reads only the file you pick with the Android file picker, and saves its location and file name as a setting on your device. The song is never sent to anyone, including the Manager.',
    'Photos you take or select with “Make a workbook from photos” are converted to a PDF on your device and saved in the device’s Download folder. The Manager never receives the photos or the PDF.',
    'When an app communicates with a server (for example, to download question data), the server records your IP address. No other personally identifiable information is collected.',
    'FuRUSH downloads its question data from a public repository on GitHub (GitHub, Inc.) at raw.githubusercontent.com. It checks for updates when the app starts and downloads data when you open a mode. At that time, your IP address and the information needed for the connection (which may include the device type) are sent to GitHub. The Manager does not receive this information from GitHub.',
    'Some apps use Google Firebase (Crashlytics / Analytics) to investigate bugs and improve the apps. Crash information, device information (model, OS, etc.), app usage and the app instance ID are sent to Google.',
    `In the apps that show ads (${AD_APPS_EN}), Google AdMob collects the advertising ID and other information to serve ads (see Section 3).`,
    'Testers are recruited by joining a Google Group (mscafemobiletester@googlegroups.com). The email address of the Google Account you join with is visible to the Manager as the group administrator and is used only to send you information about tests. Google handles group information under the Google Privacy Policy.',
    `The English translation feature uses Google ML Kit (on-device text recognition and on-device translation). The images it reads and the text it translates are never sent outside the device. However, language data for translation may be downloaded from Google’s servers, for example on first use. See also the ${A(L_MLKIT, 'ML Kit Terms of Service')}.`,
    'If you email us, we receive your email address and the content of your message.',
  ]) +
  H('3. Advertising (Google AdMob)') +
  P(`Among the Manager’s apps, ${AD_APPS_EN} show ads served by Google AdMob, an advertising service of Google LLC. ${NOAD_APPS_EN} does not show ads.`) +
  UL([
    'To serve ads, measure impressions and performance, and prevent fraud, AdMob collects and sends to Google information such as your device’s advertising ID (Android Advertising ID / iOS IDFA), IP address, approximate location (estimated from the IP address), device and OS information, app usage, and ad views and taps.',
    'Third-party vendors, including Google, may use cookies and identifiers such as the advertising ID to serve ads based on your past use of this app and other apps and websites (personalized ads).',
    `You can turn off personalized ads. On Android, delete or reset your advertising ID under Settings → Google → Ads. On iOS, turn off app tracking under Settings → Privacy &amp; Security → Tracking. You can also change your settings in Google’s ${A(L_ADCENTER, 'My Ad Center')}.`,
    `You can opt out of other third-party vendors’ use of cookies at ${A(L_ABOUTADS, 'aboutads.info')} (in Europe, ${A(L_YOURCHOICES, 'youronlinechoices.eu')}).`,
    'For users in regions where consent is required by law, such as the European Economic Area (EEA), the United Kingdom and Switzerland, ads are served after confirming consent. Without consent, only non-personalized ads are shown.',
    'BOMBOM shows native ads, for example at the top of the screen. When you run out of items, and only if you choose to, it also shows video or full-screen ads (rewarded and interstitial ads); you receive items after watching.',
    'In TaPru, AdMob is configured to treat the app as child-directed: personalized ads are not shown, and only ads suitable for all ages (rated G) are shown.',
    'In JijiQ, AdMob is configured to treat the app as child-directed and its users as under the age of consent: personalized ads are not shown, and only ads suitable for all ages (rated G) are shown. The Android version does not have the permission to use the advertising ID. Ads are only native ads in a fixed frame at the top of the screen (at the right end of the header in landscape).',
    'MP3 Converter shows only native ads in a fixed frame at the top of the screen. In regions where consent is required, you can change your ad consent at any time from “Privacy options” in the app’s menu.',
    'RAY shows native ads in fixed frames at the top of the HOME screen and of the screen during play. We plan to add video ads (rewarded ads) that are shown only if you choose to, and give you items after watching.',
    'The Manager receives only aggregated figures from AdMob, such as impressions and revenue, and never receives information that identifies individual users.',
    `For how Google uses information, see ${A(L_GOOGLE_PARTNER, 'How Google uses information from sites or apps that use our services')}, ${A(L_GOOGLE_ADS, 'Google Advertising')} and the ${A(L_GOOGLE_PRIV, 'Google Privacy Policy')}.`,
  ]) +
  H('4. Children’s privacy') +
  UL([
    'The Manager’s apps do not collect personal information such as names or contact details from children.',
    'If a child (under 13, or under the age set by the laws of their country or region) uses the apps, a parent or guardian should read and agree to this policy first.',
    'If you believe that a child’s personal information has been sent to the Manager, please contact us through <a href="#contact">Contact</a>. We will check and delete it promptly.',
  ]) +
  H('5. How we use information') +
  UL(['To provide, display and operate this website and the apps', 'To investigate and fix bugs, and to improve quality by analyzing usage', 'To send information about tests and to respond to inquiries', 'To show ads, and to measure their performance and prevent fraud']) +
  P('We do not use information beyond these purposes.') +
  H('6. Retention and security') +
  UL([
    'Data on your device is erased when you clear the app’s data or uninstall the app. However, data backed up by your device’s backup feature (BOMBOM’s and RAY’s play history) may remain in your Google Account backup and may be restored when you reinstall the app or switch devices. The Manager cannot view or restore data on your device or in backups.',
    'You can erase BOMBOM’s play history from the app’s Menu → Settings → “Reset data” (settings such as sound are kept). Erased data cannot be restored.',
    'Mistake reports received from JijiQ are kept only as long as needed to check and fix questions, and are deleted when no longer needed.',
    'Information collected by Google (AdMob, Firebase, Groups) is kept for the periods set by Google.',
    'Emails are used only to respond to you and are deleted when no longer needed.',
    'The Manager takes reasonable measures to prevent leakage or misuse of the information collected.',
  ]) +
  H('7. Sharing with third parties') +
  UL([
    'The Manager does not provide personal information to third parties without your consent, except as required by law. The Manager does not sell personal information.',
    'However, the providers of the advertising and external services described above (Google LLC, GitHub, Inc., Cloudflare, Inc., the sources of JijiQ’s photos, distributors of threat lists and country data, etc.) collect and use information under their own policies.',
    'App Monitor’s IP lookups are made directly from your device by your own action and consent; the Manager does not provide your information to anyone.',
    'These providers have servers in countries outside Japan, such as the United States, and information may be stored and processed in those countries. Please see each provider’s policy for how they protect it.',
  ]) +
  H('8. Your choices and requests for disclosure, correction or deletion') +
  UL([
    'You can delete or reset your advertising ID or refuse tracking at any time in your device settings, as described in Section 3.',
    'To stop an app’s communication and records, stop using the app and uninstall it. The data on your device will also be erased. Data remaining in your Google Account backup can be deleted from your device settings or your Google Account’s backup management. You can also erase BOMBOM’s play history with “Reset data” in the app before uninstalling.',
    'You can stop being a tester at any time by leaving the Google Group.',
    'To request disclosure, correction, suspension of use or deletion of personal information held by the Manager (mainly inquiry emails and testers’ email addresses), contact us through <a href="#contact">Contact</a> with the subject “Privacy inquiry”. After verifying your identity, we will respond to a reasonable extent in accordance with applicable law.',
    'The Manager cannot identify or delete data on your device or information held by providers such as Google. Please use each provider’s settings or contact point.',
  ]) +
  H('9. Changes to this policy') +
  P('We may change this policy as needed. Changes take effect when posted on this website. We will announce important changes on this website.') +
  H('10. Language') +
  P('The Japanese version of this policy is the official version. This English version is a translation provided for reference. If there is any difference, the Japanese version prevails.') +
  H('11. Contact') +
  P('For inquiries about this policy, see <a href="#contact">Contact</a>.') }
},

  $$('canvas.mail').forEach(cv => {
    const c = cv.getContext('2d'); if (!c) return;
    const dpr = Math.min(devicePixelRatio || 1, 3), font = '500 18px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace', h = 32;

    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.font = font; c.textBaseline = 'middle'; c.fillStyle = getComputedStyle(cv).color || '#000';
    c.fillText(addr, 4, h / 2 + 1);
  });
};

const paintBg = () => {
  const cv = $('#bg'), box = cv.parentElement.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = rng(2026), bar = (x, y, w, h) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, 3) : c.rect(x, y, w, h); c.fill(); };
  for (let y = 16, row = 0; y < box.height; y += 24, row++) {
    if (row % 7 === 6) continue;
    for (let x = -r() * 40; x < box.width;) {
      const w = 14 + r() * 58, hit = r() < 0.07;
      c.globalAlpha = hit ? .3 : .07; c.fillStyle = hit ? '#F28A1E' : '#EAF4F1';
      hit ? bar(x, y - 3, w, 13) : bar(x, y, w, 6);
      x += w + 8;
    }
  }
};
const initAccordions = (keep = {}) => {
  const BASE = SITE.name + SITE.tld;

  const setHash = id => { const h = id && isLegal(id) && LANG === 'en' ? id + '-en' : id; try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) {  } };
  const setTitle = id => { const it = all.find(x => x.dataset.id === id); document.title = it && it.dataset.title ? it.dataset.title + ' | ' + BASE : BASE; };
  const set = (g, id, { scroll = true, silent = false } = {}) => {
    g.items.forEach(it => {
      const on = it.dataset.id === id;
      it.classList.toggle('open', on);
      $('.acc-h', it).setAttribute('aria-expanded', on);
      $('.acc-p', it).inert = !on;
    });
    if (silent) return;
    setHash(id); setTitle(id);

      const el = $('#' + id), top = el.getBoundingClientRect().top;
      if (top < 0 || top > innerHeight * .5) el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
    }, reduced() ? 0 : 400);
  };
  groups.forEach(g => g.items.forEach(it => $('.acc-h', it).addEventListener('click', () => set(g, it.classList.contains('open') ? null : it.dataset.id))));

    const { id, lang } = parse(location.hash.slice(1));

    const g = groupOf(id); if (g) set(g, id, { scroll: false });
  }, SIG);
  $$('.lang-sw button').forEach(b => b.addEventListener('click', () => switchLang(b.dataset.lang)));
  groups.forEach(g => set(g, g.def, { silent: true }));
  if (keep.open) {
    keep.open.forEach(id => { const g = groupOf(id); if (g) set(g, id, { silent: true }); });
    const legal = keep.open.find(isLegal);
    if (legal) { setHash(legal); setTitle(legal); } else setTitle(null);
    if (keep.goto) { const g = groupOf(keep.goto); if (g) set(g, keep.goto); }

  }

  if (sg) set(sg, start);
};

const switchLang = (lang, { save = true, open = null } = {}) => {
  if (lang !== 'ja' && lang !== 'en') return;
  if (save) { try { localStorage.setItem(LANG_KEY, lang); } catch (e) {  } }

};
