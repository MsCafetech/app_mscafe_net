const CSS = `
:root{
  --bg:#F1F5F3;--surface:#FFFFFF;--tint:#E4ECE9;--ink:#13231F;--muted:#56675F;--line:#D3DDD9;

  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--f-body);line-break:strict;overflow-wrap:anywhere}
h1,h2,h3,h4,p,dl,dd,ol,ul{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ok);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:20px}
.nb{display:inline-block}
.hero{position:relative;background:linear-gradient(160deg,var(--deep),var(--deep-2));color:var(--on-deep);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 70%);mask-image:linear-gradient(90deg,transparent 5%,#000 70%)}
.hero .wrap{position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font:900 21px/1 var(--f-display);text-decoration:none;color:var(--on-deep)}
.brand-ico{display:block;width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
.brand .tld{font:700 17px/1 var(--f-mono);color:var(--mask);margin-left:-6px}
.nav ul{display:flex;gap:6px 18px;list-style:none;padding:0;flex-wrap:wrap;font-size:14px}
.nav ul a{color:var(--on-deep-muted);text-decoration:none;padding:4px 0}
.nav ul a:hover{color:var(--on-deep)}
.hero-copy{padding-block:36px 72px}
.tag{font:500 12px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-deep-muted)}
h1{font:900 clamp(34px,6vw,60px)/1.2 var(--f-display);margin:14px 0 20px;text-wrap:balance}
h1 .hl,.pn-h .hl{background:var(--mask);color:var(--mask-ink);padding:0 .14em;border-radius:.16em}
.lead{max-width:34em;font-size:17px;opacity:.92}
.sec{padding-block:64px 8px;scroll-margin-top:8px}
.sec:last-of-type{padding-block-end:84px}
h2{font:900 clamp(26px,4vw,38px)/1.3 var(--f-display);text-wrap:balance}
.sec-lead{margin-top:10px;color:var(--muted);max-width:36em}
.app-links{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px}
.app-links>span{flex-basis:100%}
.app-links a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--mask);text-underline-offset:4px;white-space:nowrap}
.sec-head{margin-bottom:28px}
.accs{display:grid;gap:16px}
.acc{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;scroll-margin-top:12px;transition:border-color .2s}
.acc.open{border-color:var(--mask)}
.acc-hd{margin:0}
.acc-h{width:100%;appearance:none;background:none;border:0;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;padding:18px 22px}
.acc-h:hover .acc-name{color:var(--mask)}
.ico svg{display:block;border-radius:22%}
.acc-name{display:block;font:900 22px/1.3 var(--f-display);transition:color .2s}
.flag{display:inline-block;vertical-align:middle;margin-left:10px;padding:2px 10px;border-radius:999px;background:var(--ng);color:#fff;font:700 12px/1.6 var(--f-body);white-space:nowrap}
.pn-flag{display:grid;gap:4px;padding:14px 18px;border:2px solid var(--ng);border-radius:16px;background:color-mix(in srgb,var(--ng) 10%,var(--surface))}
.pn-flag b{color:var(--ng);font:900 17px/1.4 var(--f-display)}
.pn-flag span{font-size:14px;line-height:1.7}
.acc-one{display:block;color:var(--muted);font-size:14px;line-height:1.6;margin-top:2px}
.st{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.04em;padding:6px 9px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted);margin-top:8px}
.chev{width:30px;height:30px;transition:transform .3s;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.acc.open .chev{transform:rotate(180deg)}
.acc-p{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .38s ease,visibility 0s .38s}
.acc.open .acc-p{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .38s ease,visibility 0s}
.acc-in{overflow:hidden;min-height:0}
.pn{border-top:1px solid var(--line);padding:30px 22px 34px;display:grid;gap:44px}
@media (max-width:560px){.acc-h{padding:16px 16px;gap:12px}.pn{padding-inline:16px}}
.pn-top{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:36px;align-items:center}
@media (max-width:880px){.pn-top{grid-template-columns:minmax(0,1fr)}}
.pn-h{font:900 clamp(26px,4.2vw,40px)/1.28 var(--f-display);text-wrap:balance}
.pn-lead{margin-top:14px;color:var(--muted);max-width:32em;font-size:16.5px}
.pn-os{margin-top:18px;font:500 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.cta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;font:700 15px/1 var(--f-body);padding:14px 22px;border-radius:12px;text-decoration:none;border:2px solid transparent}
.btn-main{background:var(--mask);color:var(--mask-ink)}
.btn-off{border:2px dashed var(--line);color:var(--muted)}
.tester{margin-top:22px;padding:16px 18px;border:1.5px dashed var(--mask);border-radius:16px;background:var(--tint);display:grid;gap:8px;justify-items:start}
.tester-h{font:900 16px/1.4 var(--f-display)}
.tester-p{color:var(--muted);font-size:14px;line-height:1.7}
.tester-n{color:var(--muted);font-size:12.5px;line-height:1.6}
.bugs{margin-top:22px;display:grid;gap:10px}
.bug-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bug-row b{flex:1 1 140px;font-size:14px}
.tester-l{margin:0;padding-left:1.3em;color:var(--muted);font-size:14px;line-height:1.7;display:grid;gap:2px}
.recruit-apps{display:flex;flex-wrap:wrap;gap:10px}
.ra{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.ra:hover{border-color:var(--mask)}
.ra span{display:grid;gap:2px;min-width:0}.ra b{font-size:14px}.ra small{color:var(--muted);font-size:12px}
.sub{font:900 22px/1.4 var(--f-display);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.grid.g3,.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1001px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1101px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:620px){.grid.g3,.grid.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ill{display:block;width:100%;height:auto;background:var(--tint)}
.card-body{padding:16px 18px 20px;display:grid;gap:6px}
.card h5{margin:0;font:700 17px/1.4 var(--f-display)}
.card p{font-size:14.5px;color:var(--muted)}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:26px}
.steps li{display:grid;gap:8px;align-content:start;border-top:2px solid var(--line);padding-top:16px;min-width:0}
.num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--mask);color:var(--mask-ink);font:700 15px/1 var(--f-mono)}
.steps h5{margin:0;font:700 18px/1.4 var(--f-display)}
.steps p{font-size:14.5px;color:var(--muted)}
.marks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px;font-size:13px}
.marks span{display:inline-flex;align-items:center;gap:6px}

.admin{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.badge-adm{width:96px;height:96px;border-radius:50%;overflow:hidden;flex:none;background:var(--deep);box-shadow:0 0 0 3px var(--line)}
.badge-adm img{display:block;width:100%;height:100%;object-fit:cover}
.admin h3{font:900 24px/1.3 var(--f-mono);letter-spacing:.04em}
.admin p{color:var(--muted);max-width:34em}
.admin .small{font-size:14px;margin-top:6px}
.foot{background:var(--deep);color:var(--on-deep-muted);font-size:13px;padding-block:30px}
.foot .wrap{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
.foot a{color:var(--on-deep);text-decoration:none}
.foot-links{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 22px;padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.14)}
.foot-links a{text-decoration:underline;text-underline-offset:3px}
.foot a:focus-visible{outline:2px solid var(--mask);outline-offset:3px;border-radius:3px}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}
@media (max-width:680px){.skills{grid-template-columns:minmax(0,1fr)}}
.sk{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:6px}
.sk-k{font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.sk-n{font:900 19px/1.45 var(--f-display)}
.sk-d{color:var(--muted);font-size:14px;line-height:1.7}
.lv{display:flex;gap:6px;margin:8px 0 2px}
.lv i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.lv i.on{background:var(--mask)}
.lv i.over{background:var(--ng)}
.accs.legal{gap:12px}
.acc.doc .ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(160deg,var(--deep),var(--deep-2))}
.acc.doc .ico svg{width:24px;height:24px;border-radius:0;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acc.doc .acc-name{font-size:19px}
.pn.doc-body{display:block;max-width:46em;padding-block:26px 32px;font-size:15px;line-height:1.95}
.doc-body p{margin:0 0 12px}
.doc-body .dm{color:var(--muted);font-size:13px}
.dh{font:900 17px/1.5 var(--f-display);margin:30px 0 8px;padding-left:12px;border-left:5px solid var(--mask)}
.dh:first-of-type{margin-top:6px}
.doc-body ul,.doc-body ol{margin:0 0 12px;padding-left:1.4em}
.doc-body li{margin-bottom:4px}
.doc-body a{color:var(--mask);text-underline-offset:3px;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:14px;line-height:1.7}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.tbl th{background:var(--tint);white-space:nowrap;font-weight:700}
@media (max-width:620px){.tbl,.tbl tbody,.tbl tr,.tbl th,.tbl td{display:block;width:100%}.tbl th{border-bottom:0;white-space:normal}.tbl tr{margin-bottom:10px}.tbl td{border-top:0}}
.todo{display:inline-block;font:500 11px/1.5 var(--f-mono);background:rgba(227,174,0,.16);border:1px dashed var(--warn);color:var(--ink);padding:1px 8px;border-radius:8px;margin:2px 4px 2px 0;vertical-align:baseline}
.mailbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px 18px;border:1.5px dashed var(--line);border-radius:16px;background:var(--tint);margin:6px 0 16px}
.mailbox canvas{display:block;max-width:100%;height:auto;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mailbox small{color:var(--muted);font-size:12.5px;line-height:1.6}
.sec-lead span[lang="en"]{display:block;font-size:13px}
.lang-sw{display:inline-flex;margin-top:14px;padding:4px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.lang-sw button{appearance:none;border:0;background:none;color:var(--muted);font:700 14px/1 var(--f-body);padding:9px 18px;border-radius:999px;cursor:pointer}
.lang-sw button[aria-pressed="true"]{background:var(--mask);color:var(--mask-ink)}
.no-anim *{transition:none!important}
.nav-r{display:flex;align-items:center;flex-wrap:wrap;gap:10px 20px}
.lang-sw.hd{margin-top:0;padding:3px;border-color:rgba(255,255,255,.24);background:rgba(0,0,0,.2)}
.lang-sw.hd button{color:var(--on-deep-muted);font-size:12.5px;padding:7px 12px}
.lang-sw.hd button[aria-pressed="true"]{background:var(--mask);color:var(--mask-ink)}
@media (max-width:640px){.nav{position:relative}.lang-sw.hd{position:absolute;top:21px;right:0}}
.accs.boxes{margin-top:22px}
.pn.pn-box{gap:0}
.pn-box>.tester:first-child,.pn-box>.bugs:first-child{margin-top:0}
.f-paper{fill:var(--paper);stroke:var(--paper-line);stroke-width:1.2}
.f-line{fill:var(--paper-line)}.f-mask{fill:var(--mask)}
.f-s1{fill:var(--ng)}.f-s2{fill:var(--mask)}.f-s3{fill:var(--warn)}.f-s4{fill:#8DBE2F}.f-s5{fill:#2FA84F}
.f-ok{fill:var(--ok)}.f-ng{fill:var(--ng)}.f-warn{fill:var(--warn)}
.s-mask{fill:none;stroke:var(--mask);stroke-width:2}
.s-ink{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.rp{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:1.6}
.dot{fill:var(--mask);stroke:#fff;stroke-width:1.5}
.t{font:600 11px var(--f-body);fill:var(--muted)}
.t-ans{font:700 11px var(--f-mono);fill:var(--paper-ink)}
.t-jp{font:700 15px var(--f-body);fill:var(--paper-ink)}
.f-p0{fill:var(--paper)}
.fg rect{fill:#FFD9B0;stroke:#7A4A1D;stroke-width:1.6}.fg .nb2{stroke:none}
.ripA{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:2}
.ripB{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:2}
.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 3}
.dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.steam{fill:none;stroke:#EAF4F1;stroke-width:2;stroke-linecap:round;opacity:.7;animation:steam 3.2s ease-in-out infinite}
.steam.s2{animation-delay:1.1s}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-2px);opacity:.8}}
.news{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
.nboard{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px 26px}
.nl{list-style:none;padding:0;margin:0;display:grid;gap:0}
.nl li{padding:12px 0;border-top:1px solid var(--line);line-height:1.7}
.nl li:first-child{border-top:0;padding-top:0}
.n-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-bottom:2px}
.n-date{font:500 13px/1.4 var(--f-mono);color:var(--muted)}
.n-tag{font-size:12px;font-weight:700;line-height:1.6;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--ink);border:1px solid var(--line)}
.n-txt{display:block}
.n-more{appearance:none;background:none;border:0;padding:4px 0;margin-top:8px;cursor:pointer;color:var(--ink);font-weight:700;font-size:15px;text-decoration:underline;text-decoration-color:var(--mask);text-underline-offset:4px}
.bubble{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px 22px;box-shadow:0 14px 34px rgba(0,0,0,.14);transform-origin:50% 0;animation:pop .26s cubic-bezier(.2,.9,.3,1.25)}
.bubble[hidden]{display:none}
.bubble::before{content:'';position:absolute;top:-9px;left:40px;width:16px;height:16px;background:var(--surface);border-left:1.5px solid var(--line);border-top:1.5px solid var(--line);transform:rotate(45deg)}
.bubble-h{display:flex;align-items:center;justify-content:space-between;gap:12px;font:900 18px/1.3 var(--f-display);margin-bottom:12px}
.bubble-x{appearance:none;border:0;background:var(--tint);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;flex:none}
.bubble .nl{max-height:min(420px,60vh);overflow:auto;padding-right:4px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  .news.open{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .bubble{transform-origin:0 40px}
  .bubble::before{top:36px;left:-9px;border-top:0;border-bottom:1.5px solid var(--line);border-left:1.5px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

      [L('1周クリア', 'Round clear'), L('最後のカードまで進むと「1周クリア！」。そのまま、もう1周もできます。', 'Reach the last card for “Round clear!”, then go around again if you like.')],
    ],
    info: [[L('アプリ名', 'App name'), 'FuRUSH'], [L('対応OS', 'OS'), L('Android 8.0 以上 ／ iOS（開発中）', 'Android 8.0 or later / iOS (in development)')], [L('料金', 'Price'), L('無料（広告あり）', 'Free (with ads)')], [L('配布', 'Available on'), L('Google Play（クローズドテスト中）', 'Google Play (closed testing)')], [L('モード', 'Modes'), L('全14モード（クローズドテストで使えるのは4モード）', '14 modes (4 available in closed testing)')], [L('データ', 'Data'), L('問題データは、店長が用意しています。', 'The question data is prepared by the Manager.')]],
    note: L('クローズドテスト中のため、内容は変わることがあります。デモの問題は例で、実際のアプリとは異なります。', 'The app is in closed testing, so details may change. The demo questions are only examples and differ from the real app.'),
  },
  {
    id: 'pdf-marker', name: L('PDF暗記マーカー', 'PDF Memorization Marker'), icon: pdfIcon, status: L('クローズドテスト中 ／ テスター募集中', 'In closed testing / Testers wanted'), tester: TESTER_FORM_URL, bug: BUG_FORM_PDF, test: TEST_URL_PDF,
    one: L('問題集PDFの答えをマスクして、タップで確かめる暗記アプリ。現役東大生監修。', 'A study app that masks the answers in your workbook PDFs so you can check them with a tap. Supervised by a current University of Tokyo student.'),
    headline: L('<span class="nb"><span class="hl">答え</span>を隠して、</span><span class="nb">タップで確かめる。</span>', '<span class="nb">Hide the <span class="hl">answers</span>,</span> <span class="nb">check with a tap.</span>'),
    lead: L('お手持ちの問題集PDFが、そのまま自分専用の暗記帳になります。答えにマスクをかけてタップで見え隠れ。ハイライト・書き込み・チェック・栞から、見直したいページだけの印刷まで、勉強に要るものをひとつのアプリにそろえました。紙の問題集も、写真から PDF にできます。本サイトでの画面と、実際に動作させたときの画面詳細は異なります。', 'The workbook PDFs you already have become your own flashcard books. Mask the answers and show or hide them with a tap. From highlights, handwriting, checks and bookmarks to printing just the pages you want to review, everything you need for studying is in one app. Paper workbooks can be turned into PDFs from photos, too. The screens on this site differ in detail from the real app.'),
    os: L('対応OS　Android 8.0 以上 ／ iOS（未開発）　　料金　無料（広告あり）', 'OS: Android 8.0 or later / iOS (not developed yet)　　Price: Free (with ads)'), store: { label: L('クローズドテスト中', 'In closed testing'), url: '' },
    demo: pdfDemo, init: initPdf,
    features: [
      [ILL.mask, L('答えをマスクで隠す', 'Hide answers with masks'), L('マスキングモードで、隠したい所を指でなぞるとマスクができます。色はコーラル・ネイビー・ブルー・ミント・ピンクの5色。まとめて削除もできます。', 'In masking mode, trace over what you want to hide to make a mask. Choose from five colors: coral, navy, blue, mint and pink. You can also delete masks all at once.')],
      [ILL.tap, L('タップで表示・非表示', 'Show or hide with a tap'), L('マスクをタップするたびに答えが見え隠れします。自分で答えてから確かめる、を何度でも。', 'Each tap on a mask shows or hides the answer. Answer first, then check, as many times as you like.')],
      [ILL.marks, L('チェックで学習を記録', 'Track your study with checks'), L('長押しで青、ダブルタップで赤、上スワイプで黄色のチェック。チェックはタップで消せます。「次の青／次の赤／次の黄」で、チェックのあるページへ順に移動できます。', 'Long press for a blue check, double tap for red and swipe up for yellow. Tap a check to remove it. “Next blue / red / yellow” jumps to the pages with checks in order.')],
      [ILL.highlight, L('ハイライトを引く', 'Highlight'), L('ハイライトモードで、イエロー・ピンク・ミントの3色から選んで、なぞった通りに線を引けます。引いた線はタップで消せます。', 'In highlight mode, pick yellow, pink or mint and draw lines exactly where you trace. Tap a line to remove it.')],
      [ILL.doodle, L('落書きで書き込む', 'Write and doodle'), L('落書きモードで、5色のペンで自由に書き込めます。消しゴムを選ぶと、なぞった所だけ消せます。', 'In doodle mode, write freely with pens in five colors. The eraser removes only what you trace over.')],
      [ILL.bookmark, L('栞で続きから', 'Pick up where you left off'), L('今のページに栞を挟めます（1つのPDFに1つ）。次に開いたとき、「栞から再開」か「最初から」を選べます。一覧にも栞のページが出ます。', 'Put a bookmark in the current page (one per PDF). Next time, choose “Resume from bookmark” or “From the start”. The list also shows the bookmarked page.')],
      [ILL.print, L('チェックしたページを印刷', 'Print checked pages'), L('すべてのページか、赤・青・黄のチェックがあるページを選んで印刷できます。マスク・チェック・ハイライト・落書きを含めるか、カラー／白黒、用紙サイズ（A3・B4・A4・B5・A5）も選べます。', 'Print all pages, or only the pages with red, blue or yellow checks. You can choose whether to include masks, checks, highlights and doodles, color or black and white, and paper size (A3, B4, A4, B5 or A5).')],
      [ILL.photo, L('写真から問題集を作る', 'Make a workbook from photos'), L('紙の問題集を撮影するか、ギャラリーから選んで、A4のページにしていきます（最大25ページ）。保存すると Download フォルダに PDF ができ、一覧にも追加されます。', 'Take photos of a paper workbook or pick them from your gallery to make A4 pages (up to 25). When you save, a PDF is created in the Download folder and added to the list.')],
      [ILL.swipe, L('スワイプとピンチで見やすく', 'Swipe and pinch'), L('左右のスワイプで1ページずつ切り替え。下のスライダーなら、離れたページへもすぐ移れます（動かしている間は行き先のページの見本が出ます）。ピンチで最大3倍まで拡大し、拡大中は指で動かせます。', 'Swipe left or right to turn pages one at a time. The slider at the bottom takes you straight to pages far away, showing a preview of where you will land while you drag. Pinch to zoom up to 3×, and drag while zoomed.')],
      [ILL.translate, L('英文を簡易翻訳', 'Quick English translation'), L('簡易翻訳モードで、訳したい英文の範囲を指でなぞると日本語訳が出ます。読み取りも翻訳も端末内で行うので、最初に翻訳データをダウンロードすれば、オフラインでも使えます。簡易的な翻訳のため、誤訳がある場合があります。', 'In quick translation mode, trace over English text to see a Japanese translation. Reading and translation happen on the device, so after downloading the translation data once, it works offline. As a simple translation, it may contain mistakes.')],
      [ILL.coord, L('拡大してもズレないマスク', 'Masks that stay put when zoomed'), L('マスクは画面上の位置ではなく、PDF上の座標で記録します。拡大縮小や画面の回転をしても、同じ場所に残ります。', 'Masks are saved by their position in the PDF, not on the screen, so they stay in place when you zoom or rotate.')],
      [ILL.layers, L('元のPDFは書き換えない', 'Your original PDF stays untouched'), L('マスク・チェック・ハイライト・落書きは、PDFの上に重ねて表示するだけ。元のファイルには手を加えません。記録はPDFごとに保存され、メニューから種類ごとにまとめて消すこともできます。', 'Masks, checks, highlights and doodles are only shown on top of the PDF. The original file is never changed. Records are saved for each PDF, and you can clear each kind all at once from the menu.')],
    ],
    steps: [
      [L('PDFを追加する', 'Add a PDF'), L('一覧の「＋」から問題集のPDFを選びます。「写真から問題集を作る」で、紙の問題集から作ることもできます。登録は10個までです。PDFのコピーは作らず、元のファイルはそのままです。', 'Pick a workbook PDF with “+” in the list, or make one from a paper workbook with “Make a workbook from photos”. Up to 10 PDFs. No copy is made; the original file stays as it is.')],
      [L('答えにマスクをかける', 'Mask the answers'), L('マスキングモードで、答えの上を指でなぞってマスクを作ります。あとから移動やサイズ変更、色の変更もできます。', 'In masking mode, trace over the answers to make masks. You can move, resize and recolor them later.')],
      [L('タップして確かめる', 'Tap to check'), L('マスクをタップして答えを確認。できた問題、間違えた問題をチェックで残せます。', 'Tap a mask to check the answer. Mark questions you got right or wrong with checks.'), `<div class="marks"><span>${badge('ok')}${L('長押し', 'Long press')}</span><span>${badge('ng')}${L('ダブルタップ', 'Double tap')}</span><span>${badge('warn')}${L('上スワイプ', 'Swipe up')}</span></div>`],
    ],
    info: [[L('アプリ名', 'App name'), L('PDF暗記マーカー', 'PDF Memorization Marker')], [L('監修', 'Supervised by'), L('現役東大生', 'A current University of Tokyo student')], [L('対応OS', 'OS'), L('Android 8.0 以上 ／ iOS（未開発）', 'Android 8.0 or later / iOS (not developed yet)')], [L('料金', 'Price'), L('無料（広告あり）', 'Free (with ads)')], [L('配布', 'Available on'), L('Google Play（クローズドテスト中）', 'Google Play (closed testing)')], [L('保存', 'Storage'), L('マスク・チェック・ハイライト・落書き・栞はPDFごとに記録します。PDFファイルのコピーは作りません。',
        'Masks, checks, highlights, doodles and bookmarks are saved for each PDF. No copies of PDF files are made.')], [L('操作説明', 'How-to'), L('初回に動く絵で説明します。PDFを開いた画面のメニュー（\u2630）から、いつでも見直せます。', 'Animated guides are shown the first time. You can see them again any time from the menu (\u2630) on the PDF screen.')]],
  },
  {
    id: 'mp3-convert', name: L('MP3変換', 'MP3 Converter'), icon: m2aIcon, status: L('クローズドテスト中 ／ テスター募集中', 'In closed testing / Testers wanted'), tester: TESTER_FORM_URL, bug: BUG_FORM_M2A, test: TEST_URL_M2A,
    one: L('動画から音声だけを取り出して、MP3・AAC(M4A)・WAV に変換する Android アプリ。広告はあっても邪魔にならず、広告を見ながら手軽に変換。', 'An Android app that takes just the audio from a video and converts it to MP3, AAC (M4A) or WAV. The ads stay out of your way, so you can convert with ease while they sit quietly on screen.'),
    headline: L('<span class="nb">動画の音だけ、</span><span class="nb"><span class="hl">手軽に</span>MP3に。</span>', '<span class="nb">Just the sound,</span> <span class="nb"><span class="hl">easily</span> to MP3.</span>'),
    lead: L('コーヒーを一杯淹れるくらいの手軽さで、動画から音声だけを取り出します。動画を選んで、形式と音質を決めて、ボタンをひとつ押すだけ。MP3・AAC(M4A)・WAV に変換できます。広告は画面の上の決まった枠にだけ出して、操作の邪魔をしません。広告を眺めながら、手軽に変換できます。変換は端末の中だけで行い、動画や音声をサーバーへ送りません。ただいまクローズドテスト中です。本サイトでの画面と、実際に動作させたときの画面詳細は異なります。',
        'As easy as making a cup of coffee: take just the audio out of a video. Choose a video, pick a format and quality, and press one button to convert it to MP3, AAC (M4A) or WAV. Ads appear only in a fixed frame at the top of the screen and never get in the way, so you can convert with ease while they sit quietly on screen. Everything happens on your device; videos and audio are never sent to a server. Now in closed testing. The screens on this site differ in detail from the real app.'),
    os: L('対応OS　Android 10 以上　　料金　無料（広告あり）', 'OS: Android 10 or later　　Price: Free (with ads)'), store: { label: L('クローズドテスト中', 'In closed testing'), url: '' },
    demo: m2aDemo, init: initM2a,
    features: [
      [ILL.m2aPick, L('動画を選ぶだけ', 'Just choose a video'), L('端末のファイル選択から動画を1本選ぶと、再生時間や音声トラックを確認します。音声が入っていない動画は、その場でお知らせします。', 'Pick one video with your device’s file picker, and the app checks its length and audio tracks. If a video has no audio, it tells you right away.')],
      [ILL.m2aFormat, L('MP3・AAC・WAV に変換', 'Convert to MP3, AAC or WAV'), L('MP3 と AAC(M4A) は 128・192・256・320kbps から音質を選べます（初めは192kbps）。WAV は PCM 16bit で、圧縮しないので劣化しません。選ぶたびに、変換後の推定サイズが出ます。', 'For MP3 and AAC (M4A), choose 128, 192, 256 or 320 kbps (192 kbps to start). WAV is 16-bit PCM and uncompressed, so there is no further loss. The estimated file size updates each time you choose.')],
      [ILL.m2aPreview, L('トラック選びと30秒の試聴', 'Track choice and a 30-second preview'), L('音声トラックが複数ある動画は「トラック 1」「トラック 2」から選べます。先頭30秒を試聴して、変換する前に確かめられます。', 'For videos with more than one audio track, choose “Track 1”, “Track 2” and so on. Preview the first 30 seconds to check before converting.')],
      [ILL.m2aSave, L('保存先とファイル名', 'Save location and file name'), L('音楽フォルダ（初めの設定）・ダウンロードフォルダ・元の動画と同じフォルダ・指定したフォルダから選べます。ファイル名は元の動画の名前から付け、同じ名前があれば「名前 (2)」のように番号を足します。空き容量も、変換の前に確かめます。', 'Save to the Music folder (the default), the Downloads folder, the same folder as the video, or a folder you choose. The file is named after the video, and a number such as “name (2)” is added if the name is taken. Free space is checked before converting.')],
      [ILL.m2aAd, L('邪魔にならない広告', 'Ads that stay out of the way'), L('広告は、画面の上の決まった枠（画面の高さの15%）にだけ出します。全画面の広告や、ボタンに重なる広告はありません。「音声に変換する」ボタンは画面の下にいつも見えています。広告が読み込めなくても、すべての機能を使えます。', 'Ads appear only in a fixed frame at the top (15% of the screen height). There are no full-screen ads and no ads over buttons. The “Convert to audio” button always stays visible at the bottom. Every feature works even if no ad loads.')],
      [ILL.m2aLocal, L('端末の中だけで変換', 'Converted on your device only'), L('変換は端末の中の FFmpeg で行い、動画や音声をサーバーへ送りません。ストレージの権限も求めません。変換中は画面を点けたままにし、端末が熱くなりすぎたときは変換を止めます。', 'Conversion runs with FFmpeg on your device, and videos and audio are never sent to a server. The app does not ask for storage permission. The screen stays on while converting, and conversion stops if the device gets too hot.')],
      [ILL.m2aDone, L('できたらすぐ再生・共有', 'Play or share right away'), L('完了画面から、端末の音楽アプリで再生したり、ほかのアプリへ共有したりできます。そのまま別の動画も変換できます。日本語・英語、ライト・ダークに対応しています。', 'From the done screen, play the file in your music app or share it with other apps, then convert another video. Available in Japanese and English, with light and dark themes.')],
    ],
    steps: [
      [L('動画を選ぶ', 'Choose a video'), L('「動画を選ぶ」を押して、端末の動画から1本選びます。', 'Press “Choose a video” and pick one video on your device.')],
      [L('形式と音質を決める', 'Pick a format and quality'), L('形式（MP3・AAC・WAV）と音質を選びます。必要なら、保存先とファイル名も変えられます。', 'Choose the format (MP3, AAC or WAV) and quality. You can also change the save location and file name if you like.')],
      [L('「音声に変換する」を押す', 'Press “Convert to audio”'), L('画面の下のボタンで変換が始まります。変換中はアプリを開いたままお待ちください。ほかのアプリに切り替えたり、画面をロックしたりすると、変換は中止されます。', 'The button at the bottom starts the conversion. Keep the app open while it runs; switching to another app or locking the screen stops the conversion.')],
    ],
    info: [[L('アプリ名', 'App name'), L('MP3変換（MP3 Converter）', 'MP3変換 (MP3 Converter)')], [L('対応OS', 'OS'), L('Android 10 以上（縦画面）', 'Android 10 or later (portrait)')], [L('料金',
        'Price'), L('無料（広告あり）', 'Free (with ads)')], [L('配布', 'Available on'), L('Google Play（クローズドテスト中）', 'Google Play (closed testing)')], [L('変換形式',
        'Formats'), 'MP3 / AAC (M4A) / WAV'], [L('言語', 'Languages'), L('日本語・English', 'Japanese, English')], [L('外部との通信', 'External connections'), L('広告の表示と、広告の同意の確認（Google AdMob）だけ。動画や音声は送りません。',
        'Only to show ads and check ad consent (Google AdMob). Videos and audio are never sent.')]],
    note: L('クローズドテスト中のため、内容は変わることがあります。変換するのは、ご自身で撮影した動画など、使ってよい動画だけにしてください。コピー防止（DRM）のかかった動画や壊れた動画、一部の形式（WMV・FLV・TS など）は、変換できないことがあります。MP3・AAC は圧縮し直すため、元の音より少し劣化することがあります。',
        'The app is in closed testing, so details may change. Please convert only videos you are allowed to use, such as ones you filmed yourself. Copy-protected (DRM) or damaged videos and some formats (such as WMV, FLV and TS) may not convert. MP3 and AAC are re-compressed, so the sound may be slightly lower in quality than the original.'),
  },
  {
    id: 'app-monitor', name: L('アプリ見守り', 'App Monitor'), icon: amIcon, status: L('クローズドテスト中 ／ テスター募集中', 'In closed testing / Testers wanted'), tester: TESTER_FORM_URL, bug: BUG_FORM_AM, test: TEST_URL_AM,
    one: L('不正な通信をするアプリを見つけて、アンインストールをすすめる Android の警告アプリ。', 'An Android alert app that finds apps with suspicious network traffic and recommends uninstalling them.'),
    headline: L('<span class="nb">怪しいアプリに、</span><span class="nb"><span class="hl">気づける</span>。</span>', '<span class="nb">Spot the</span> <span class="nb"><span class="hl">suspicious</span> apps.</span>'),
    lead: L('スマホのアプリが、知らないうちに怪しい通信をしていないか。店長が店内を見回るように、アプリごとの通信を端末の中で記録して、Bot 化や不正利用の兆候を見つけたら警告します。不正な通信をするアプリは、アンインストールを検討してください。記録は端末の中だけに保存し、外部へは送りません。本サイトでの画面と、実際に動作させたときの画面詳細は異なります。',
        'Are the apps on your phone making suspicious connections without you knowing? Like a caf\u00E9 manager walking the floor, App Monitor records each app’s traffic on the device and warns you when it finds signs that an app has become a bot or is being misused. Please consider uninstalling apps with suspicious traffic. Records stay on the device only and are never sent out. The screens on this site differ in detail from the real app.'),
    os: L('対応OS　Android 9 以上（Android のみ）　　料金　無料（広告あり）', 'OS: Android 9 or later (Android only)　　Price: Free (with ads)'), store: { label: L('クローズドテスト中', 'In closed testing'), url: '' },
    demo: amDemo, init: initAm,
    features: [
      [ILL.amVpn, L('端末の中だけで見守る', 'Monitors on the device only'), L('VPN の仕組みで、アプリごとの通信を端末の中で中継・記録します。外部の VPN サーバーは使わず、root も不要です。', 'Using the VPN mechanism, each app’s traffic is relayed and recorded on the device. No outside VPN server is used, and no root is needed.')],
      [ILL.amSigns, L('23の兆候で危険度を判定', 'Rates risk from 23 signs'), L('多数の宛先、使っていない時間の通信、一定間隔の通信、IP アドレス直接の通信など23種類の兆候から、アプリごとに「危険・要注意・注意・正常・除外」を判定します。', 'From 23 kinds of signs, such as many destinations, traffic while not in use, traffic at regular intervals and direct connections to IP addresses, each app is rated Danger, Warning, Caution, Normal or Excluded.')],
      [ILL.amThreat, L('脅威リストと照合', 'Checks threat lists'), L('URLhaus・HaGeZi・Feodo Tracker・Spamhaus DROP の脅威リストと宛先を照らし合わせます。リストはアプリが配布元から直接取得します。', 'Destinations are checked against the URLhaus, HaGeZi, Feodo Tracker and Spamhaus DROP threat lists. The app downloads the lists directly from their publishers.')],
      [ILL.amNotify, L('通知でいつでも確認', 'Always visible in notifications'), L('見守りの状況（危険度ごとのアプリ数）を通知に表示し、5分ごとに更新します。ほかの VPN が動いた・端末に止められたなどで見守りが止まったときは、TOP に原因と時刻が出ます。', 'The monitoring status (number of apps at each risk level) is shown in a notification and updated every 5 minutes. If monitoring stops, for example because another VPN started or the device stopped it, TOP shows the reason and the time.')],

  let addr = '';
  try { addr = atob([...MAIL_R].reverse().join('')); } catch (e) { return; }
  $$('canvas.mail').forEach(cv => {
    const c = cv.getContext('2d'); if (!c) return;
    const dpr = Math.min(devicePixelRatio || 1, 3), font = '500 18px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace', h = 32;

    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.font = font; c.textBaseline = 'middle'; c.fillStyle = getComputedStyle(cv).color || '#000';
    c.fillText(addr, 4, h / 2 + 1);
  });
};

const paintBg = () => {
  const cv = $('#bg'), box = cv.parentElement.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = rng(2026), bar = (x, y, w, h) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, 3) : c.rect(x, y, w, h); c.fill(); };
  for (let y = 16, row = 0; y < box.height; y += 24, row++) {
    if (row % 7 === 6) continue;
    for (let x = -r() * 40; x < box.width;) {
      const w = 14 + r() * 58, hit = r() < 0.07;
      c.globalAlpha = hit ? .3 : .07; c.fillStyle = hit ? '#F28A1E' : '#EAF4F1';
      hit ? bar(x, y - 3, w, 13) : bar(x, y, w, 6);
      x += w + 8;
    }
  }
};
const initAccordions = (keep = {}) => {
  const BASE = SITE.name + SITE.tld;

  const isLegal = id => !!id && LEGAL.some(d => d.id === id);
  const parse = raw => { const m = /^(.+)-(en|ja)$/.exec(raw); return m && isLegal(m[1]) ? { id: m[1], lang: m[2] } : { id: raw, lang: null }; };
  const setHash = id => { const h = id && isLegal(id) && LANG === 'en' ? id + '-en' : id; try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) {  } };
  const setTitle = id => { const it = all.find(x => x.dataset.id === id); document.title = it && it.dataset.title ? it.dataset.title + ' | ' + BASE : BASE; };
  const set = (g, id, { scroll = true, silent = false } = {}) => {
    g.items.forEach(it => {
      const on = it.dataset.id === id;
      it.classList.toggle('open', on);
      $('.acc-h', it).setAttribute('aria-expanded', on);
      $('.acc-p', it).inert = !on;
    });
    if (silent) return;
    setHash(id); setTitle(id);

      const el = $('#' + id), top = el.getBoundingClientRect().top;
      if (top < 0 || top > innerHeight * .5) el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
    }, reduced() ? 0 : 400);
  };
  groups.forEach(g => g.items.forEach(it => $('.acc-h', it).addEventListener('click', () => set(g, it.classList.contains('open') ? null : it.dataset.id))));
  $$('a[data-open]').forEach(a => a.addEventListener('click', e => { const id = a.dataset.open, g = groupOf(id); if (!g) return; e.preventDefault(); set(g, id); }));
  addEventListener('hashchange', () => {
    const { id, lang } = parse(location.hash.slice(1));
    if (lang && lang !== LANG) { switchLang(lang, { save: false, open: id }); return; }
    const g = groupOf(id); if (g) set(g, id, { scroll: false });
  }, SIG);
  $$('.lang-sw button').forEach(b => b.addEventListener('click', () => switchLang(b.dataset.lang)));
  groups.forEach(g => set(g, g.def, { silent: true }));
  if (keep.open) {
    keep.open.forEach(id => { const g = groupOf(id); if (g) set(g, id, { silent: true }); });
    const legal = keep.open.find(isLegal);
    if (legal) { setHash(legal); setTitle(legal); } else setTitle(null);
    if (keep.goto) { const g = groupOf(keep.goto); if (g) set(g, keep.goto); }
    else if (keep.anchor) { const el = $$(ANCHORS)[keep.anchor.i]; if (el) scrollTo({ top: scrollY + el.getBoundingClientRect().top - keep.anchor.top, behavior: 'instant' }); }
    return;
  }
  const start = parse(location.hash.slice(1)).id, sg = groupOf(start);
  if (sg) set(sg, start);
};

const switchLang = (lang, { save = true, open = null } = {}) => {
  if (lang !== 'ja' && lang !== 'en') return;
  if (save) { try { localStorage.setItem(LANG_KEY, lang); } catch (e) {  } }
  if (lang === LANG && !open) return;
  const marks = [...document.querySelectorAll(ANCHORS)];
  const ai = marks.findIndex(el => el.offsetParent !== null && el.getBoundingClientRect().bottom > 0 && el.getBoundingClientRect().top > -400);
  const anchor = ai < 0 ? null : marks[ai];

    anchor: !open && anchor ? { i: ai, top: anchor.getBoundingClientRect().top } : null,
    goto: open,
  };

};
