const avatar = kind => kind === 'ai'
  ? `<svg class="av" viewBox="0 0 56 56" aria-hidden="true"><rect class="av-bg" width="56" height="56" rx="16"/><path class="av-ai" d="M28 11l4.6 11.4L44 27l-11.4 4.6L28 43l-4.6-11.4L12 27l11.4-4.6z"/><path class="av-ai" d="M42 8l1.6 3.4L47 13l-3.4 1.6L42 18l-1.6-3.4L37 13l3.4-1.6z"/></svg>`

/* ===== ユーティリティ ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rng = seed => () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
let uid = 0;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== スタイル ===== */
const DARK = `--bg:#0C1614;--surface:#13231F;--tint:#0D1B18;--ink:#E5F0EC;--muted:#97ADA6;--line:#25403A;--deep:#0A2622;--deep-2:#0F3630;--mask:#F59A35;--paper:#E9EFEC;`;
const CSS = `
:root{
  /* 配色: アプリ自身の色（マスクのオレンジ、青・赤・黄のチェック）を軸にする */
  --bg:#F1F5F3;--surface:#FFFFFF;--tint:#E4ECE9;--ink:#13231F;--muted:#56675F;--line:#D3DDD9;
  --deep:#0F3A34;--deep-2:#16504A;--on-deep:#EAF4F1;--on-deep-muted:#A8C4BD;
  --mask:#F28A1E;--mask-ink:#4A2400;--ok:#2E6BE6;--ng:#DE3F2E;--warn:#E3AE00;
  --paper:#FFFFFF;--paper-ink:#1D2A27;--paper-line:#D5DDDA;
  /* 文字: 丸ゴシック（見出し）× 角ゴシック（本文）× 等幅（技術ラベル） */
  --f-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${DARK}color-scheme:dark}}
:root[data-theme="dark"]{${DARK}color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--f-body);line-break:strict;overflow-wrap:anywhere}
h1,h2,h3,h4,p,dl,dd,ol,ul{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ok);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:20px}
.nb{display:inline-block}

/* --- hero --- */
.hero{position:relative;background:linear-gradient(160deg,var(--deep),var(--deep-2));color:var(--on-deep);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 70%);mask-image:linear-gradient(90deg,transparent 5%,#000 70%)}
.hero .wrap{position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font:900 21px/1 var(--f-display);text-decoration:none;color:var(--on-deep)}
.brand-ico{display:block;width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
.brand .tld{font:700 17px/1 var(--f-mono);color:var(--mask);margin-left:-6px}
.nav ul{display:flex;gap:6px 18px;list-style:none;padding:0;flex-wrap:wrap;font-size:14px}
.nav ul a{color:var(--on-deep-muted);text-decoration:none;padding:4px 0}
.nav ul a:hover{color:var(--on-deep)}
.hero-copy{padding-block:36px 72px}
.tag{font:500 12px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-deep-muted)}
h1{font:900 clamp(34px,6vw,60px)/1.2 var(--f-display);margin:14px 0 20px;text-wrap:balance}
h1 .hl,.pn-h .hl{background:var(--mask);color:var(--mask-ink);padding:0 .14em;border-radius:.16em}
.lead{max-width:34em;font-size:17px;opacity:.92}

/* --- sections --- */
.sec{padding-block:64px 8px;scroll-margin-top:8px}
.sec:last-of-type{padding-block-end:84px}
h2{font:900 clamp(26px,4vw,38px)/1.3 var(--f-display);text-wrap:balance}
.sec-lead{margin-top:10px;color:var(--muted);max-width:36em}
.app-links{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px}
.app-links>span{flex-basis:100%}
.app-links a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--mask);text-underline-offset:4px;white-space:nowrap}
.sec-head{margin-bottom:28px}

/* --- accordion --- */
.accs{display:grid;gap:16px}
.acc{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;scroll-margin-top:12px;transition:border-color .2s}
.acc.open{border-color:var(--mask)}
.acc-hd{margin:0}
.acc-h{width:100%;appearance:none;background:none;border:0;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;padding:18px 22px}
.acc-h:hover .acc-name{color:var(--mask)}
.ico svg{display:block;border-radius:22%}
.acc-name{display:block;font:900 22px/1.3 var(--f-display);transition:color .2s}
.flag{display:inline-block;vertical-align:middle;margin-left:10px;padding:2px 10px;border-radius:999px;background:var(--ng);color:#fff;font:700 12px/1.6 var(--f-body);white-space:nowrap}
.pn-flag{display:grid;gap:4px;padding:14px 18px;border:2px solid var(--ng);border-radius:16px;background:color-mix(in srgb,var(--ng) 10%,var(--surface))}
.pn-flag b{color:var(--ng);font:900 17px/1.4 var(--f-display)}
.pn-flag span{font-size:14px;line-height:1.7}
.acc-one{display:block;color:var(--muted);font-size:14px;line-height:1.6;margin-top:2px}
.st{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.04em;padding:6px 9px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted);margin-top:8px}
.chev{width:30px;height:30px;transition:transform .3s;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.acc.open .chev{transform:rotate(180deg)}
.acc-p{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .38s ease,visibility 0s .38s}
.acc.open .acc-p{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .38s ease,visibility 0s}
.acc-in{overflow:hidden;min-height:0}
.pn{border-top:1px solid var(--line);padding:30px 22px 34px;display:grid;gap:44px}
@media (max-width:560px){.acc-h{padding:16px 16px;gap:12px}.pn{padding-inline:16px}}
.pn-top{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:36px;align-items:center}
@media (max-width:880px){.pn-top{grid-template-columns:minmax(0,1fr)}}
.pn-h{font:900 clamp(26px,4.2vw,40px)/1.28 var(--f-display);text-wrap:balance}
.pn-lead{margin-top:14px;color:var(--muted);max-width:32em;font-size:16.5px}
.pn-os{margin-top:18px;font:500 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.cta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;font:700 15px/1 var(--f-body);padding:14px 22px;border-radius:12px;text-decoration:none;border:2px solid transparent}
.btn-main{background:var(--mask);color:var(--mask-ink)}
.btn-off{border:2px dashed var(--line);color:var(--muted)}
.tester{margin-top:22px;padding:16px 18px;border:1.5px dashed var(--mask);border-radius:16px;background:var(--tint);display:grid;gap:8px;justify-items:start}
.tester-h{font:900 16px/1.4 var(--f-display)}
.tester-p{color:var(--muted);font-size:14px;line-height:1.7}
.tester-n{color:var(--muted);font-size:12.5px;line-height:1.6}
.bugs{margin-top:22px;display:grid;gap:10px}
.bug-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bug-row b{flex:1 1 140px;font-size:14px}
.tester-l{margin:0;padding-left:1.3em;color:var(--muted);font-size:14px;line-height:1.7;display:grid;gap:2px}
.recruit-apps{display:flex;flex-wrap:wrap;gap:10px}
.ra{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.ra:hover{border-color:var(--mask)}
.ra span{display:grid;gap:2px;min-width:0}.ra b{font-size:14px}.ra small{color:var(--muted);font-size:12px}
.sub{font:900 22px/1.4 var(--f-display);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
/* 件数に合わせて列数を固定（余りが出ないように: 6件=3列、4・8件=4列、狭い画面は2列→1列） */
.grid.g3,.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1001px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1101px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:620px){.grid.g3,.grid.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ill{display:block;width:100%;height:auto;background:var(--tint)}
.card-body{padding:16px 18px 20px;display:grid;gap:6px}
.card h5{margin:0;font:700 17px/1.4 var(--f-display)}
.card p{font-size:14.5px;color:var(--muted)}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:26px}
.steps li{display:grid;gap:8px;align-content:start;border-top:2px solid var(--line);padding-top:16px;min-width:0}
.num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--mask);color:var(--mask-ink);font:700 15px/1 var(--f-mono)}
.steps h5{margin:0;font:700 18px/1.4 var(--f-display)}
.steps p{font-size:14.5px;color:var(--muted)}
.marks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px;font-size:13px}
.marks span{display:inline-flex;align-items:center;gap:6px}
.marks .bd{width:20px;height:20px}
.info{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:8px 24px}
.dl>div{display:grid;grid-template-columns:7em minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.dl>div:last-child{border-bottom:0}
.dl dt{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:12px}

/* --- demo 共通 --- */
.demo{display:grid;justify-items:center;gap:14px;background:var(--tint);border-radius:22px;padding:26px 18px}
.demo-note{font-size:13px;color:var(--muted);text-align:center}
.amd-scr{background:#0E1113;color:#ECEFEE;border-radius:25px;padding:20px 14px 18px;display:grid;gap:12px;min-height:400px;align-content:start}
.amd-ring{appearance:none;justify-self:center;width:150px;height:150px;border-radius:50%;border:8px solid #5DC9AF;background:#15332C;color:#ECEFEE;display:grid;place-content:center;gap:6px;cursor:pointer;transition:border-color .2s,background-color .2s}
.amd-ring b{font:900 20px/1.2 var(--f-display)}.amd-ring small{font-size:11.5px;color:#A5AEB3}
.amd-scr.off .amd-ring{border-color:#4A5459;background:#22282C}
.amd-sub{text-align:center;font-size:11.5px;color:#A5AEB3}
.amd-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;transition:opacity .2s}
.amd-scr.off .amd-list{opacity:.4}
.amd-row{appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:12px;border:1px solid #2D3438;background:#171B1E;color:#ECEFEE;font:700 13px/1.3 var(--f-body);text-align:left;cursor:pointer}
.amd-lv{flex:none;font-size:11px;padding:3px 9px;border-radius:999px}
.amd-lv.l0{background:#3A1816;color:#FF8B80}.amd-lv.l1{background:#3A2112;color:#FFA566}.amd-lv.l2{background:#322A0B;color:#F2D45C}.amd-lv.l3{background:#15332C;color:#5DC9AF}
.amd-why{padding:8px 12px 2px;display:grid;gap:4px}.amd-why[hidden]{display:none}
.amd-why p{font-size:12px;line-height:1.6;color:#A5AEB3}
.frd-scr{background:#0A1020;color:#EAF0FF;border-radius:25px;padding:16px 16px 18px;display:grid;gap:12px;min-height:400px;align-content:start}
.frd-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 12px/1.3 var(--f-body)}
.frd-title{color:#5EE1FD}.frd-sc{font:700 11.5px/1 var(--f-mono);color:#A3AEC0}
.frd-prompt{font-size:13px;color:#A3AEC0;text-align:center}
.frd-stage{overflow:hidden;border-radius:18px}
.frd-card{min-height:150px;display:grid;place-content:center;gap:10px;text-align:center;padding:16px;border-radius:18px;background:#13224A;border:1.5px solid #24366B;transition:transform .18s ease,opacity .18s ease,border-color .15s}
.frd-card.open{border-color:#5EE1FD}.frd-card.out{transform:translateY(-36px);opacity:0}.frd-card.in{transform:translateY(36px);opacity:0;transition:none}
.frd-q{font:900 22px/1.35 var(--f-display)}
.frd-a{font:900 26px/1.2 var(--f-display);color:#5EE1FD;min-height:1.2em}
.frd-hit{appearance:none;justify-self:center;width:68px;height:68px;border-radius:50%;border:0;background:#FF4D6D;color:#fff;font:900 30px/1 var(--f-display);cursor:pointer;box-shadow:0 8px 20px -6px rgba(255,77,109,.6)}
.frd-hit:disabled{opacity:.35;cursor:default}
.frd-grade{display:grid;grid-template-columns:1fr;gap:8px}
.frd-grade button{appearance:none;border:0;border-radius:12px;padding:10px 0;font:700 13px/1 var(--f-body);color:#fff;cursor:pointer}
.frd-grade .frd-rev{background:transparent;box-shadow:inset 0 0 0 1px #5EE1FD;color:#5EE1FD}.frd-grade .frd-rev[aria-pressed="true"]{background:#5EE1FD;color:#0A1020}
.frd-sec{display:flex;align-items:center;gap:10px;font-size:12px;color:#A3AEC0;white-space:nowrap}
.frd-sec input{min-width:0}
.frd-sec input{flex:1;accent-color:#5EE1FD}.frd-sec output{font:700 12px/1 var(--f-mono);color:#EAF0FF;min-width:3.4em;text-align:right}
/* --- タップる？ demo（横画面のゲーム機。左に数字、右がタップエリア） --- */
.tpd{width:min(440px,100%);max-width:100%;min-width:0;aspect-ratio:2/1;display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:8px;padding:10px;border-radius:24px;background:#070B1F;color:#E8EEFF;box-shadow:0 26px 50px -22px rgba(0,0,0,.5)}
.tpd-info{display:grid;align-content:center;gap:1px;padding:8px 10px;border-radius:14px;background:#0E1534;min-width:0}
.tpd-k{font-size:10.5px;color:#8C97C4}
.tpd-info b{font:700 18px/1.15 var(--f-mono);color:#E8EEFF}
.tpd-info .tpd-n{font-size:24px;color:#2FE6FF}
.tpd-lv{min-height:1.3em;margin-top:2px;font:900 12px/1.2 var(--f-display);white-space:nowrap}
.tpd-area{position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(120% 90% at 50% 0%,#142160,#0E1534 70%);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.tpd-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tpd-start{appearance:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:12px 26px;background:#2FE6FF;color:#070B1F;font:900 16px/1 var(--f-display);white-space:nowrap;cursor:pointer;box-shadow:0 0 24px rgba(47,230,255,.5)}
.tpd-start[hidden]{display:none}
.tpd-big{position:absolute;inset:0;display:grid;place-content:center;font:900 40px/1 var(--f-display);color:#FFE14D;text-shadow:0 0 18px rgba(255,225,77,.6);pointer-events:none}
.tpd-big.s{font-size:22px;place-content:start end;padding:10px 12px;color:#FF4FA3;text-shadow:0 0 12px rgba(255,79,163,.6)}
.tpd-res{width:min(440px,100%);display:grid;gap:10px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.tpd-res[hidden]{display:none}
.tpd-sum{display:flex;flex-wrap:wrap;gap:4px 16px}.tpd-sum b{font:700 18px/1 var(--f-mono);color:var(--ink)}
.tpd-bars{display:flex;align-items:flex-end;gap:4px;height:60px}
.tpd-bars i{flex:1;background:var(--mask);border-radius:3px 3px 0 0;min-height:2px}
.tpd-cap{font-size:12px;color:var(--muted)}
.genre{display:inline-block;vertical-align:middle;margin-left:10px;padding:2px 10px;border-radius:999px;background:var(--ok);color:#fff;font:700 12px/1.6 var(--f-body);white-space:nowrap}
.mtd-langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.mtd-l{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 13px/1 var(--f-mono);padding:8px 12px;border-radius:999px;cursor:pointer}
.mtd-l[aria-pressed="true"]{background:var(--mask);border-color:var(--mask);color:var(--mask-ink)}
.mtd-paper{position:relative;min-height:330px}
.mtd-p{appearance:none;background:none;border:2px dashed transparent;border-radius:12px;padding:6px 8px;margin:-8px -10px;text-align:left;font:500 13px/1.7 var(--f-body);color:var(--paper-ink);cursor:pointer}
.mtd-p:hover{border-color:var(--paper-line)}.mtd-p.on{border:2px solid #2F7BEF}
.mtd-dlg{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);background:var(--paper);border:1px solid var(--paper-line);border-radius:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);padding:12px 14px;display:grid;gap:8px}
.mtd-dlg[hidden]{display:none}
.mtd-top{display:flex;align-items:center;gap:8px}.mtd-top .mtd-lab{flex:1}
.mtd-lab{font:700 11.5px/1.4 var(--f-body);color:var(--muted)}
.mtd-close{appearance:none;border:0;background:var(--paper-line);color:var(--paper-ink);width:24px;height:24px;border-radius:50%;font:700 14px/1 sans-serif;cursor:pointer}
.mtd-src{font-size:12.5px;line-height:1.6;color:var(--paper-ink)}
.mtd-bot{border-top:1px solid var(--paper-line);padding-top:8px;display:grid;gap:4px}
.mtd-ja{font-size:13px;line-height:1.7;color:var(--paper-ink);font-weight:700}
.demo-sub{font:500 12px/1.5 var(--f-mono);color:var(--muted);text-align:center;letter-spacing:.02em}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .bd{width:18px;height:18px}
.bd{display:block;width:24px;height:24px}
.bc-ok{fill:var(--ok)}.bc-ng{fill:var(--ng)}.bc-warn{fill:var(--warn)}
.bp-ok,.bp-ng{stroke:#fff}.bp-warn{stroke:#4A3600}

/* --- PDF demo --- */
.phone{position:relative;overflow:hidden;width:min(340px,100%);background:#0A1513;border-radius:34px;padding:9px;box-shadow:0 26px 50px -22px rgba(0,0,0,.5)}
/* 自動デモの指（先端が座標の原点） */
.af{position:absolute;left:0;top:0;width:80px;height:90px;pointer-events:none;z-index:5;opacity:0;transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .3s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.af svg{display:block;overflow:visible}
.af-rp{fill:none;stroke:#1D2A27;stroke-opacity:.55;stroke-width:2.4;opacity:0;transform-box:fill-box;transform-origin:center}
.af.tap .af-rp{animation:rp .55s ease-out}
@keyframes rp{from{transform:scale(.3);opacity:.9}to{transform:scale(1.7);opacity:0}}
.replay{appearance:none;border:0;background:var(--mask);color:var(--mask-ink);font:700 14px/1 var(--f-body);border-radius:999px;padding:11px 18px;cursor:pointer}
.ph-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:25px 25px 0 0;background:#17302B;color:#EAF4F1;font-size:12px;line-height:1.3}
.ph-name{font-family:var(--f-mono);font-size:11px;color:#A8C4BD;min-width:0}
.paper{background:var(--paper);color:var(--paper-ink);padding:16px 16px 20px;display:grid;gap:14px}
.p-title{font:700 14px/1.5 var(--f-display);padding-bottom:8px;border-bottom:2px solid var(--paper-line)}
.gls{display:grid;gap:7px}
.gl{display:block;height:6px;border-radius:3px;background:var(--paper-line)}
.q{display:grid;gap:8px}
.qrow{display:flex;align-items:center;gap:8px;font:500 13.5px/1.5 var(--f-body)}
.qn{font:700 12px/1 var(--f-mono);color:#4A2400;background:#FCE3C6;border-radius:5px;padding:4px 6px;flex:none}
.qt{min-width:0}
.mk{margin-left:auto;width:24px;height:24px;flex:none}
.mk svg{display:block;width:24px;height:24px;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.mask{appearance:none;border:2px solid var(--mask);background:var(--mask);color:transparent;font:700 13px/1 var(--f-body);height:30px;min-width:9em;max-width:100%;padding:0 12px;border-radius:7px;cursor:pointer;text-align:left;justify-self:start;transition:background-color .2s,color .2s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x}
.mask[aria-pressed="true"]{background:transparent;color:var(--paper-ink);border-style:dashed}
/* 解説文の穴埋め（文中に入るマスク） */
.ex{display:grid;gap:6px}
.tagx{margin-left:auto;font:500 10px/1 var(--f-mono);letter-spacing:.06em;border:1.5px solid var(--paper-line);color:#5B6B66;padding:4px 7px;border-radius:999px;flex:none}
.exp{font:500 13.5px/2.15 var(--f-body);margin:0}
.mask.inl{display:inline-block;height:auto;min-width:4em;padding:1px 8px;line-height:1.55;font-size:inherit;border-width:1.5px;border-radius:5px;margin-inline:1px;vertical-align:baseline;text-align:center}
.mk.in{display:inline-block;margin:0 2px;width:18px;height:18px;vertical-align:-4px}
.mk.in:empty{display:none}
.mk.in svg{width:18px;height:18px}
.ph-foot{display:flex;align-items:center;gap:12px;padding:12px 14px 14px;border-radius:0 0 25px 25px;background:#17302B;color:#EAF4F1;font:500 12px/1 var(--f-mono)}
.track{position:relative;flex:1;height:4px;border-radius:2px;background:rgba(234,244,241,.22)}
.thumb{position:absolute;left:14%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--mask)}

/* --- TG demo --- */
.tgd{position:relative;width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:18px}
.tgd canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:22px}
.wc{display:grid;gap:2px;justify-items:center;background:var(--tint);border-radius:16px;padding:20px 12px;text-align:center}
.wc small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.1em}
.wc b{font:900 34px/1.3 var(--f-display)}.wc span{color:var(--muted);font-size:15px}
.gauge{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.seg{aspect-ratio:1;border-radius:50%;background:var(--line);transition:background-color .25s}
.seg.c1{background:var(--ng)}.seg.c2{background:var(--mask)}.seg.c3{background:var(--warn)}.seg.c4{background:#8DBE2F}.seg.c5{background:#2FA84F}.seg.m{background:#2FA84F;box-shadow:0 0 0 2px var(--mask)}
.gmeta{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.score{font:700 28px/1 var(--f-mono)}.score small{font-size:14px;color:var(--muted)}
.state{font-size:14px;color:var(--muted);text-align:right}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bt{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;cursor:pointer;font-weight:700;font-size:14px;display:grid;gap:2px;justify-items:center}
.bt i{font:700 12px var(--f-mono);font-style:normal;color:var(--muted)}
.bt:hover:not(:disabled){border-color:var(--ink)}.bt:disabled{opacity:.4;cursor:default}
.bt.ok{border-color:var(--ok)}.bt.wr{border-color:var(--warn)}.bt.ng{border-color:var(--ng)}
.master{display:grid;justify-items:center;gap:6px;text-align:center}
.master[hidden]{display:none}
.master b{font:900 26px var(--f-display);color:var(--mask)}
.reset{appearance:none;border:0;background:var(--mask);color:var(--mask-ink);font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer}

/* --- 開発体制（体制図） --- */
.node{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center}
.node.pm{border-color:var(--mask)}
.node .av{grid-row:1/4;width:56px;height:56px;display:block}
.av-bg{fill:var(--tint)}.av-h{fill:var(--ink);opacity:.78}.av-ai{fill:var(--mask)}
.role{font:700 11px/1.4 var(--f-mono);letter-spacing:.14em;color:var(--muted)}
.nm{font:900 21px/1.3 var(--f-display);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kind{font:500 10px/1 var(--f-mono);letter-spacing:.06em;border:1.5px solid var(--line);color:var(--muted);padding:4px 7px;border-radius:999px}
.kind.ai{border-color:var(--mask);color:var(--ink)}
.dsc{font-size:14px;color:var(--muted);line-height:1.6}
/* 広い画面: PMを最上段、相談役はPMの横（点線）、Coderは下段 */
@media (min-width:1001px){
  .org{--cg:28px;--rg:36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:var(--cg);row-gap:var(--rg);max-width:1000px;margin-inline:auto;align-items:center}
  .node.pm{grid-column:2/4;grid-row:1}
  .node.adv{grid-column:4;grid-row:1}
  .node.coder{grid-column:2/4;grid-row:2}
  .node.sup{grid-column:1;grid-row:1}
  .node.sup::before{content:'';position:absolute;left:100%;top:50%;width:var(--cg);border-top:2px dashed var(--line)}
  .node.subc{grid-column:4;grid-row:2}
  .node.subc::before{content:'';position:absolute;right:100%;top:50%;width:var(--cg);border-top:2px solid var(--line)}
  .node.adv::before{content:'';position:absolute;right:100%;top:50%;width:var(--cg);border-top:2px dashed var(--line)}
  .node.coder::before{content:'';position:absolute;left:50%;bottom:100%;height:var(--rg);border-left:2px solid var(--line)}
}
/* 狭い画面: 左の線に沿って縦に並べる（相談役だけ横線が点線） */
@media (max-width:1000px){
  .org{display:grid;grid-template-columns:minmax(0,1fr);row-gap:18px}
  .node.coder,.node.subc,.node.adv,.node.sup{margin-left:30px}
  .node.pm::after{content:'';position:absolute;left:10px;top:100%;height:18px;border-left:2px solid var(--line)}
  .node.coder::before,.node.subc::before,.node.adv::before,.node.sup::before{content:'';position:absolute;left:-20px;top:-9px;width:20px;height:calc(50% + 9px);border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:10px}
  .node.adv::before,.node.sup::before{border-bottom-style:dashed}
  .node.coder::after,.node.subc::after,.node.adv::after,.node.sup::after{content:'';position:absolute;left:-20px;top:50%;bottom:-9px;border-left:2px solid var(--line)}
  .org>.node:last-child::after{content:none}
}

/* --- 運営者 / footer --- */
.admin{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.badge-adm{width:96px;height:96px;border-radius:50%;overflow:hidden;flex:none;background:var(--deep);box-shadow:0 0 0 3px var(--line)}
.badge-adm img{display:block;width:100%;height:100%;object-fit:cover}
.admin h3{font:900 24px/1.3 var(--f-mono);letter-spacing:.04em}
.admin p{color:var(--muted);max-width:34em}
.admin .small{font-size:14px;margin-top:6px}
.foot{background:var(--deep);color:var(--on-deep-muted);font-size:13px;padding-block:30px}
.foot .wrap{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
.foot a{color:var(--on-deep);text-decoration:none}
.foot-links{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 22px;padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.14)}
.foot-links a{text-decoration:underline;text-underline-offset:3px}
.foot a:focus-visible{outline:2px solid var(--mask);outline-offset:3px;border-radius:3px}

/* --- スキルマップ --- */
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}
@media (max-width:680px){.skills{grid-template-columns:minmax(0,1fr)}}
.sk{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:6px}
.sk-k{font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.sk-n{font:900 19px/1.45 var(--f-display)}
.sk-d{color:var(--muted);font-size:14px;line-height:1.7}
.lv{display:flex;gap:6px;margin:8px 0 2px}
.lv i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.lv i.on{background:var(--mask)}
.lv i.over{background:var(--ng)}

/* --- 法務・ポリシー（アコーディオン） --- */
.accs.legal{gap:12px}
.acc.doc .ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(160deg,var(--deep),var(--deep-2))}
.acc.doc .ico svg{width:24px;height:24px;border-radius:0;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acc.doc .acc-name{font-size:19px}
.pn.doc-body{display:block;max-width:46em;padding-block:26px 32px;font-size:15px;line-height:1.95}
.doc-body p{margin:0 0 12px}
.doc-body .dm{color:var(--muted);font-size:13px}
.dh{font:900 17px/1.5 var(--f-display);margin:30px 0 8px;padding-left:12px;border-left:5px solid var(--mask)}
.dh:first-of-type{margin-top:6px}
.doc-body ul,.doc-body ol{margin:0 0 12px;padding-left:1.4em}
.doc-body li{margin-bottom:4px}
.doc-body a{color:var(--mask);text-underline-offset:3px;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:14px;line-height:1.7}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.tbl th{background:var(--tint);white-space:nowrap;font-weight:700}
@media (max-width:620px){.tbl,.tbl tbody,.tbl tr,.tbl th,.tbl td{display:block;width:100%}.tbl th{border-bottom:0;white-space:normal}.tbl tr{margin-bottom:10px}.tbl td{border-top:0}}
.todo{display:inline-block;font:500 11px/1.5 var(--f-mono);background:rgba(227,174,0,.16);border:1px dashed var(--warn);color:var(--ink);padding:1px 8px;border-radius:8px;margin:2px 4px 2px 0;vertical-align:baseline}
.mailbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px 18px;border:1.5px dashed var(--line);border-radius:16px;background:var(--tint);margin:6px 0 16px}
.mailbox canvas{display:block;max-width:100%;height:auto;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mailbox small{color:var(--muted);font-size:12.5px;line-height:1.6}
/* 規約の言語切替 */
.accs.legal:not(.en) .l-en,.accs.legal.en .l-ja{display:none}
.sec-lead span[lang="en"]{display:block;font-size:13px}
.lang-sw{display:inline-flex;margin-top:14px;padding:4px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.lang-sw button{appearance:none;border:0;background:none;color:var(--muted);font:700 14px/1 var(--f-body);padding:9px 18px;border-radius:999px;cursor:pointer}
.lang-sw button[aria-pressed="true"]{background:var(--mask);color:var(--mask-ink)}
/* テスター募集欄の折りたたみ */
.accs.boxes{margin-top:22px}
.pn.pn-box{gap:0}
.pn-box>.tester:first-child,.pn-box>.bugs:first-child{margin-top:0}

/* --- svg 部品 --- */
.f-paper{fill:var(--paper);stroke:var(--paper-line);stroke-width:1.2}
.f-line{fill:var(--paper-line)}.f-mask{fill:var(--mask)}
.f-s1{fill:var(--ng)}.f-s2{fill:var(--mask)}.f-s3{fill:var(--warn)}.f-s4{fill:#8DBE2F}.f-s5{fill:#2FA84F}
.f-ok{fill:var(--ok)}.f-ng{fill:var(--ng)}.f-warn{fill:var(--warn)}
.s-mask{fill:none;stroke:var(--mask);stroke-width:2}
.s-ink{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.rp{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:1.6}
.dot{fill:var(--mask);stroke:#fff;stroke-width:1.5}
.t{font:600 11px var(--f-body);fill:var(--muted)}
.t-ans{font:700 11px var(--f-mono);fill:var(--paper-ink)}
.t-jp{font:700 15px var(--f-body);fill:var(--paper-ink)}
.f-p0{fill:var(--paper)}
.fg rect{fill:#FFD9B0;stroke:#7A4A1D;stroke-width:1.6}.fg .nb2{stroke:none}
.ripA{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:2}
.ripB{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:2}
.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 3}
.dash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.steam{fill:none;stroke:#EAF4F1;stroke-width:2;stroke-linecap:round;opacity:.7;animation:steam 3.2s ease-in-out infinite}
.steam.s2{animation-delay:1.1s}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-2px);opacity:.8}}
/* --- お知らせ（カード＋吹き出し） --- */
.news{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
.nboard{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px 26px}
.nl{list-style:none;padding:0;margin:0;display:grid;gap:0}
.nl li{padding:12px 0;border-top:1px solid var(--line);line-height:1.7}
.nl li:first-child{border-top:0;padding-top:0}
.n-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-bottom:2px}
.n-date{font:500 13px/1.4 var(--f-mono);color:var(--muted)}
.n-tag{font-size:12px;font-weight:700;line-height:1.6;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--ink);border:1px solid var(--line)}
.n-txt{display:block}
.n-more{appearance:none;background:none;border:0;padding:4px 0;margin-top:8px;cursor:pointer;color:var(--ink);font-weight:700;font-size:15px;text-decoration:underline;text-decoration-color:var(--mask);text-underline-offset:4px}
.bubble{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px 22px;box-shadow:0 14px 34px rgba(0,0,0,.14);transform-origin:50% 0;animation:pop .26s cubic-bezier(.2,.9,.3,1.25)}
.bubble[hidden]{display:none}
.bubble::before{content:'';position:absolute;top:-9px;left:40px;width:16px;height:16px;background:var(--surface);border-left:1.5px solid var(--line);border-top:1.5px solid var(--line);transform:rotate(45deg)}
.bubble-h{display:flex;align-items:center;justify-content:space-between;gap:12px;font:900 18px/1.3 var(--f-display);margin-bottom:12px}
.bubble-x{appearance:none;border:0;background:var(--tint);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;flex:none}
.bubble .nl{max-height:min(420px,60vh);overflow:auto;padding-right:4px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  .news.open{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .bubble{transform-origin:0 40px}
  .bubble::before{top:36px;left:-9px;border-top:0;border-bottom:1.5px solid var(--line);border-left:1.5px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
`;

/* ===== 画像をコードで描く部品 ===== */
const badgeInner = k => `<circle class="bc-${k}" cx="12" cy="12" r="11"/><path class="bp-${k}" d="M7 12.5l3.2 3.2L17 8.8" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
const badge = k => `<svg viewBox="0 0 24 24" class="bd" aria-hidden="true">${badgeInner(k)}</svg>`;
const finger = (x, y) => `<g class="fg" transform="translate(${x} ${y}) rotate(-20)"><rect x="-9" y="22" width="30" height="26" rx="9"/><rect x="-5.5" y="0" width="11" height="34" rx="5.5"/><rect class="nb2" x="-3.8" y="24" width="7.6" height="14"/></g>`;
const lines = (x, y, w, n, step, seed) => {
  const r = rng(seed);
  return Array.from({ length: n }, (_, i) => `<rect class="f-line" x="${x}" y="${y + i * step}" width="${(w * (0.6 + r() * 0.4)).toFixed(1)}" height="4" rx="2"/>`).join('');
};
const logo = (s = 36) => `<svg viewBox="0 0 40 40" width="${s}" height="${s}" aria-hidden="true"><path class="steam" d="M14 11c-2.4-2.2 2.4-4.2 0-7"/><path class="steam s2" d="M22 11c-2.4-2.2 2.4-4.2 0-7"/><path d="M7 15h22v10a9 9 0 0 1-9 9h-4a9 9 0 0 1-9-9z" fill="#EAF4F1"/><rect x="7" y="20" width="22" height="6" fill="#F28A1E"/><path d="M29 18h2.6a4 4 0 0 1 0 8H29" fill="none" stroke="#EAF4F1" stroke-width="2.4"/><rect x="4" y="35.4" width="28" height="2.6" rx="1.3" fill="#EAF4F1" opacity=".55"/></svg>`;

const explain = (n, title, html) => `<div class="ex"><div class="qrow"><span class="qn">Q${n}</span><span class="qt">${title}</span><span class="tagx">解説</span></div><p class="exp">${html}</p></div>`;

/* 選ばれた科目から、Q1（クイズ）＋Q2以降（解説文の穴埋め）を組み立てる */
const demoBody = () => {
  const hole = t => t.replace(/\{\{(.+?)\}\}/g, (_, w) => blank(w));
  return fillLines(3, 5) + quiz(1, DEMO.q1[0], DEMO.q1[1])
    + DEMO.ex.map(([t, h], i) => fillLines(1, 9 + i * 4) + explain(i + 2, t, hole(h))).join('');
};

/* ===== 各アプリのデモ動作 ===== */
function initPdf(root) {
  /* チェックは、クイズならQの行の右端、穴埋めならマスクのすぐ右に付く */
  const setMark = (btn, k) => {
    const q = btn.closest('.q'), mk = q ? $('.mk', q) : btn.nextElementSibling;
    if (btn.dataset.mk === k) { delete btn.dataset.mk; mk.innerHTML = ''; return; }
    btn.dataset.mk = k; mk.innerHTML = badge(k);
  };
  $$('.mask', root).forEach(btn => {
    let timer = 0, long = false, swiped = false, sx = 0, sy = 0, last = 0;
    const toggle = () => btn.setAttribute('aria-pressed', btn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    btn.addEventListener('pointerdown', e => { long = swiped = false; sx = e.clientX; sy = e.clientY; timer = setTimeout(() => { long = true; setMark(btn, 'ok'); }, 500); });
    btn.addEventListener('pointermove', e => {
      if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clearTimeout(timer);
      if (!swiped && sy - e.clientY > 36 && Math.abs(e.clientX - sx) < 40) { swiped = true; setMark(btn, 'warn'); }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => btn.addEventListener(t, () => clearTimeout(timer)));
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('click', () => {
      if (long || swiped) { long = swiped = false; return; }
      const now = Date.now(); toggle();
      if (now - last < 320) setMark(btn, 'ng');   // 素早く2回 = ダブルタップ（表示は元に戻る）
      last = now;
    });
  });
  autoDemo(root);
}

/* 自動デモ: 指が出てきてマスクをタップ → 答えが出る → 最初に戻る、を繰り返す。触ると止まる */
function autoDemo(root) {
  if (reduced()) return;
  const phone = $('.phone', root), af = $('.af', root), note = $('.demo-note', root), btn = $('.replay', root);
  const masks = $$('.mask', root);
  let token = 0, active = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const place = (x, y, ms) => { af.style.transition = `transform ${ms}ms cubic-bezier(.4,0,.2,1),opacity .3s`; af.style.transform = `translate(${x - 20}px,${y - 20}px)`; };
  const target = m => { const p = phone.getBoundingClientRect(), b = m.getBoundingClientRect(); return [b.left - p.left + b.width * .82, b.top - p.top + b.height * .55]; };
  const ready = async t => { while (t === token && !(root.classList.contains('open') && !document.hidden)) await sleep(300); return t === token; };
  const reset = () => masks.forEach(m => m.setAttribute('aria-pressed', 'false'));

  const run = async () => {
    const t = ++token; active = true;
    btn.hidden = true; note.textContent = '自動で再生中です。触ると、自分で操作できます。';
    while (t === token) {
      if (!await ready(t)) return;
      await sleep(700); if (t !== token) return;
      reset();
      const w = phone.getBoundingClientRect().width, h = phone.getBoundingClientRect().height;
      af.style.transition = 'none'; af.style.transform = `translate(${w * .6 - 20}px,${h + 10}px)`; af.style.opacity = 1; void af.offsetWidth;
      for (const m of masks) {
        if (!await ready(t)) return;
        const [x, y] = target(m);
        place(x, y, 700); await sleep(820); if (t !== token) return;
        af.classList.remove('tap'); void af.offsetWidth; af.classList.add('tap');
        await sleep(170); if (t !== token) return;
        m.setAttribute('aria-pressed', 'true');
        place(x + 24, y + 24, 400);           // 答えが隠れないよう、指を少しずらす
        await sleep(1250); if (t !== token) return;
      }
      place(w * .6, h + 10, 700); af.style.opacity = 0;
      await sleep(1800);
    }
  };
  const stop = () => {
    if (!active) return;
    active = false; token++; af.style.opacity = 0;
    btn.hidden = false; note.textContent = '操作できます。';
  };
  phone.addEventListener('pointerdown', stop);
  phone.addEventListener('keydown', stop);
  btn.addEventListener('click', () => {
    $$('.mask', root).forEach(b => { delete b.dataset.mk; const q = b.closest('.q'); (q ? $('.mk', q) : b.nextElementSibling).innerHTML = ''; });
    reset(); run();
  });
  run();
}

function petals(cv) {
  if (reduced()) return;
  const box = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = box.width * dpr; cv.height = box.height * dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = rng(Date.now() & 0xffff);
  const ps = Array.from({ length: 42 }, () => ({ x: r() * box.width, y: -20 - r() * box.height * .6, v: 1.2 + r() * 1.6, sw: r() * 6, ph: r() * 6, rot: r() * 6, s: 6 + r() * 6, col: r() < .7 ? '#E5B95C' : '#B07F1E' }));
  const t0 = performance.now();
  const tick = now => {
    const t = now - t0; c.clearRect(0, 0, box.width, box.height);
    ps.forEach(p => { p.y += p.v; p.rot += .03; c.save(); c.translate(p.x + Math.sin(t / 400 + p.ph) * p.sw * 4, p.y); c.rotate(p.rot); c.fillStyle = p.col; c.globalAlpha = .9; c.beginPath(); c.ellipse(0, 0, p.s * .55, p.s, 0, 0, 6.3); c.fill(); c.restore(); });
    if (t < 4200) requestAnimationFrame(tick); else c.clearRect(0, 0, box.width, box.height);
  };
  requestAnimationFrame(tick);
}

    $('small', ring).textContent = on ? `要確認 ${counts}件` : '記録と検知を停止中';

    const w = b.nextElementSibling, on = w.hidden;
    w.hidden = !on; b.setAttribute('aria-expanded', on);

}

function initFr(root) {
  let deck = 0, idx = 0, timer = 0, open = false;
  let rev = false;
  const card = $('.frd-card', root), q = $('.frd-q', root), a = $('.frd-a', root), hit = $('.frd-hit', root);
  const sc = $('.frd-sc', root), rng = $('.frd-sec input', root), out = $('.frd-sec output', root), revBtn = $('.frd-rev', root);
  const face = k => FR_DECKS[deck][3][idx][rev ? 1 - k : k];
  const draw = () => {
    const [, title, prompt, cards] = FR_DECKS[deck];
    $('.frd-title', root).textContent = title; $('.frd-prompt', root).textContent = rev ? '' : prompt;
    q.textContent = face(0); a.textContent = ''; open = false; sc.textContent = `${idx + 1} / ${cards.length}`;
    card.classList.remove('open'); hit.disabled = false;
  };
  const next = () => {
    clearTimeout(timer);
    card.classList.add('out');
    setTimeout(() => { idx = (idx + 1) % FR_DECKS[deck][3].length; draw(); card.classList.remove('out'); card.classList.add('in'); requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('in'))); }, reduced() ? 0 : 180);
  };
  hit.addEventListener('click', () => {
    if (open) return;
    open = true; a.textContent = face(1); card.classList.add('open'); hit.disabled = true;
    timer = setTimeout(next, Number(rng.value) * 100);
  });
  revBtn.addEventListener('click', () => { clearTimeout(timer); rev = !rev; revBtn.setAttribute('aria-pressed', rev); draw(); });
  rng.addEventListener('input', () => { out.textContent = (Number(rng.value) / 10).toFixed(1) + '秒'; });
  $$('.frd-m', root).forEach(m => m.addEventListener('click', () => {
    clearTimeout(timer); deck = Number(m.dataset.i); idx = 0; rev = false; revBtn.setAttribute('aria-pressed', 'false');
    $$('.frd-m', root).forEach(x => x.setAttribute('aria-pressed', x === m)); draw();
  }));
  draw();
}

function initTp(root) {
  const area = $('.tpd-area', root), cv = $('.tpd-cv', root), start = $('.tpd-start', root), big = $('.tpd-big', root), res = $('.tpd-res', root);
  const elT = $('.tpd-time', root), elN = $('.tpd-n', root), elR = $('.tpd-r', root), elLv = $('.tpd-lv', root);
  const c = cv.getContext('2d');
  let fx = 0, state = 'idle', t0 = 0, taps = [], fxs = [], raf = 0, special = false, coolUntil = 0;
  const down = new Set();
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rate = now => { let n = 0; for (let i = taps.length - 1; i >= 0 && taps[i] > now - 1000; i--) n++; return n; };
  const lvOf = r => (r >= 10 ? 3 : r >= 8 ? 2 : r >= 5 ? 1 : 0);
  const fit = () => {
    const b = area.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(b.width * dpr)) { cv.width = Math.round(b.width * dpr); cv.height = Math.round(b.height * dpr); }
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    return b;
  };
  const show = (txt, small) => { big.textContent = txt; big.classList.toggle('s', !!small); };
  /* エフェクト1件を描く。k = 経過の割合（0→1） */
  const drawFx = (f, now) => {
    const k = (now - f.t) / f.life;
    if (k >= 1) return false;
    const [, col, snd] = TP_FX[f.kind], a = 1 - k, sz = f.sp ? 2.2 : 1 + f.lv * .25;
    c.globalAlpha = a; c.strokeStyle = c.fillStyle = col;
    if (f.kind === 0) {
      c.lineWidth = 3 * sz; c.beginPath(); c.arc(f.x, f.y, 6 + k * 46 * sz, 0, 6.283); c.stroke();
      c.strokeStyle = '#FF8A1F'; c.lineWidth = 2; c.beginPath(); c.arc(f.x, f.y, 4 + k * 26 * sz, 0, 6.283); c.stroke();
    } else if (f.kind === 1) {
      for (let i = 0; i < 7; i++) { const an = f.r + i * .898, d = k * 44 * sz; c.beginPath(); c.arc(f.x + Math.cos(an) * d, f.y + Math.sin(an) * d - k * k * 10, 3 * sz * (1 - k * .5), 0, 6.283); c.fill(); }
    } else if (f.kind === 2) {
      const s = 9 * sz * (1 + k * .6), x = f.x, y = f.y - k * 34;
      c.beginPath(); c.moveTo(x, y + s * .9); c.bezierCurveTo(x - s * 1.6, y - s * .2, x - s * .6, y - s * 1.3, x, y - s * .45); c.bezierCurveTo(x + s * .6, y - s * 1.3, x + s * 1.6, y - s * .2, x, y + s * .9); c.fill();
    }
    if (snd && k < .7) { c.globalAlpha = 1 - k / .7; c.font = `900 ${f.sp ? 22 : 13}px "Zen Maru Gothic",sans-serif`; c.textAlign = 'center'; c.fillText(f.sp ? '必殺技!!' : snd, f.x + 18, f.y - 22 - k * 12); }
    return true;
  };
  const loop = () => {
    const b = fit(), now = performance.now();
    c.clearRect(0, 0, b.width, b.height);
    fxs = fxs.filter(f => drawFx(f, now));
    c.globalAlpha = 1;
    if (state === 'play') {
      const left = Math.max(0, TP_SEC - (now - t0) / 1000), r = rate(now), lv = lvOf(r);
      elT.textContent = left.toFixed(1); elR.textContent = r;
      elLv.textContent = TP_LV[lv][0]; elLv.style.color = TP_LV[lv][1];
      if (left <= 0) finish();
    }
    raf = state === 'play' || fxs.length ? requestAnimationFrame(loop) : 0;
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  const finish = () => {
    state = 'done'; show('FINISH!'); elLv.textContent = ''; elR.textContent = 0; elT.textContent = '0.0';
    const sec = Array.from({ length: TP_SEC }, () => 0);
    taps.forEach(t => { sec[Math.min(TP_SEC - 1, Math.floor((t - t0) / 1000))]++; });
    const half = TP_SEC / 2, a = sec.slice(0, half).reduce((x, y) => x + y, 0), z = sec.slice(half).reduce((x, y) => x + y, 0), mx = Math.max(...sec, 1);
    const ch = a ? Math.round((z - a) / a * 100) : null;
    setTimeout(() => {
      show(''); start.textContent = 'もう一度'; start.hidden = false;
      res.innerHTML = `<div class="tpd-sum"><span>合計 <b>${taps.length}</b> 回</span><span>平均 <b>${(taps.length / TP_SEC).toFixed(1)}</b> 回/秒</span><span>最高 <b>${Math.max(...sec)}</b> 回/秒</span></div>
<div class="tpd-bars" role="img" aria-label="1秒ごとのタップ数">${sec.map(n => `<i style="height:${Math.round(n / mx * 100)}%" title="${n}回"></i>`).join('')}</div>
<p class="tpd-cap">${ch === null ? '前半と後半は比べられませんでした。' : `後半${half}秒は、前半${half}秒にくらべて ${ch >= 0 ? '+' : ''}${ch}%。`}アプリでは30秒を、持久力・リズム・位置のブレまで分析します。</p>`;
      res.hidden = false;
    }, 900);
  };
  const run = async () => {
    start.hidden = true; res.hidden = true; taps = []; special = false; coolUntil = 0; elN.textContent = 0; elR.textContent = 0; elT.textContent = TP_SEC.toFixed(1); elLv.textContent = '';
    state = 'count';
    for (const n of ['3', '2', '1']) { show(n); await sleep(650); }
    show('GO!'); setTimeout(() => { if (big.textContent === 'GO!') show(''); }, 450);
    state = 'play'; t0 = performance.now(); kick();
  };
  area.addEventListener('pointerdown', e => {
    if (e.target === start) return;
    const other = down.size > 0;
    down.add(e.pointerId);
    if (state !== 'play' || other) return;
    e.preventDefault();
    const now = performance.now();
    if (now - t0 >= TP_SEC * 1000) return;
    taps.push(now); elN.textContent = taps.length;
    const r = rate(now), sp = special;
    if (sp) { special = false; coolUntil = now + 3000; } else if (r >= 20 && now > coolUntil) special = true;
    if (taps.length % 25 === 0) { show(`${taps.length} HIT!`, true); setTimeout(() => { if (big.classList.contains('s')) show(''); }, 600); }

      const b = area.getBoundingClientRect();
      fxs.push({ x: e.clientX - b.left, y: e.clientY - b.top, t: now, life: sp ? 900 : 520, kind: fx, lv: lvOf(r), sp, r: Math.random() * 6.283 });
      if (fxs.length > 40) fxs.shift();
    }
  });

    fx = Number(b.dataset.i);
    $$('.tpd-fx', root).forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
}

function initMt(root) {
  let cur = 0;
  const p = $('.mtd-p', root), dlg = $('.mtd-dlg', root);
  const show = () => {
    const [name, , text] = MT_SAMPLES[cur];
    p.classList.add('on');
    $('.mtd-top .mtd-lab', root).textContent = `${name}（自動判別）▼`;
    $('.mtd-src', root).textContent = text;
    dlg.hidden = false;
  };
  const hide = () => { dlg.hidden = true; p.classList.remove('on'); };
  $$('.mtd-l', root).forEach(b => b.addEventListener('click', () => {
    cur = Number(b.dataset.i);
    $$('.mtd-l', root).forEach(x => x.setAttribute('aria-pressed', x === b));
    p.textContent = MT_SAMPLES[cur][2];
    hide();
  }));
  p.addEventListener('click', show);
  $('.mtd-close', root).addEventListener('click', hide);
}

function initTg(root) {
  let score = 5, master = false;
  const segs = $$('.seg', root), sc = $('.score', root), st = $('.state', root), g = $('.gauge', root), m = $('.master', root);
  const draw = () => {
    segs.forEach((s, i) => { s.className = 'seg' + (i < score ? (master ? ' m' : ' c' + (Math.floor(i / 2) + 1)) : ''); });
    sc.innerHTML = `${score}<small> / 10</small>`; g.setAttribute('aria-valuenow', score);

    m.hidden = !master; $$('.bt', root).forEach(b => b.disabled = master);
  };

    if (master) return;

    if (score >= 10) { master = true; petals($('.petals', root)); }
    draw();

  $('.reset', root).addEventListener('click', () => { score = 5; master = false; draw(); });

}

const drawMail = () => {
  let addr = '';
  try { addr = atob([...MAIL_R].reverse().join('')); } catch (e) { return; }
  $$('canvas.mail').forEach(cv => {
    const c = cv.getContext('2d'); if (!c) return;
    const dpr = Math.min(devicePixelRatio || 1, 3), font = '500 18px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace', h = 32;
    c.font = font;
    const w = Math.ceil(c.measureText(addr).width) + 8;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px';
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.font = font; c.textBaseline = 'middle'; c.fillStyle = getComputedStyle(cv).color || '#000';
    c.fillText(addr, 4, h / 2 + 1);
  });
};
const initMail = () => {
  drawMail();
  try { document.fonts && document.fonts.load('500 18px "JetBrains Mono"').then(drawMail).catch(() => {}); } catch (e) { /* 無視 */ }
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawMail); } catch (e) { /* 無視 */ }
};

const newsLi = n => `<li><span class="n-top"><span class="n-date">${n.date}</span><span class="n-tag">${n.tag}</span></span>${n.text.split('\n').map(t => `<span class="n-txt">${t}</span>`).join('')}</li>`;
const newsEl = () => {
  const size = n => 1 + n.text.split('\n').length;
  const total = NEWS.reduce((a, n) => a + size(n), 0);
  let shown = NEWS;
  if (total > NEWS_LINES) {
    let used = 0;
    shown = [];
    for (const n of NEWS) { if (used + size(n) > NEWS_LINES - 1) break; shown.push(n); used += size(n); }
  }
  const more = NEWS.length > 0;
  return `<div class="news">
  <div class="nboard">
    <ul class="nl">${shown.map(newsLi).join('')}</ul>
    ${more ? '<button type="button" class="n-more" aria-expanded="false" aria-controls="news-all">・・・ すべてを表示</button>' : ''}
  </div>
  ${more ? `<div class="bubble" id="news-all" role="region" aria-label="お知らせ（すべて）" tabindex="-1" hidden>
    <div class="bubble-h"><span>お知らせ　すべて（${NEWS.length}件）</span><button type="button" class="bubble-x" aria-label="閉じる">×</button></div>

  </div>` : ''}
</div>`;
};
const initNews = () => {
  const btn = $('.n-more'), bub = $('#news-all'), box = $('.news');
  if (!btn || !bub) return;
  const toggle = on => {
    bub.hidden = !on; box.classList.toggle('open', on); btn.setAttribute('aria-expanded', on);
    btn.textContent = on ? '・・・ 閉じる' : '・・・ すべてを表示';
    if (on) { bub.focus({ preventScroll: true }); if (innerWidth < 900) bub.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' }); }
  };
  btn.addEventListener('click', () => toggle(bub.hidden));
  $('.bubble-x', bub).addEventListener('click', () => { toggle(false); btn.focus(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !bub.hidden) { toggle(false); btn.focus(); } });
};

        <p class="small">お店へのご連絡：<a href="#contact">お問い合わせ先を見る</a></p></div></div>
    <h3 class="sub" style="margin-top:44px">スキルマップ</h3>
    <div class="skills">
      <article class="sk"><span class="sk-n">セキュリティアーキテクト</span><div class="lv" role="img" aria-label="レベル：5／5">${'<i class="on"></i>'.repeat(5)}</div></article>
      <article class="sk"><span class="sk-n">ITスペシャリスト</span><div class="lv" role="img" aria-label="レベル：5／5">${'<i class="on"></i>'.repeat(5)}</div></article>
      <article class="sk"><span class="sk-n">アプリ開発</span><div class="lv" role="img" aria-label="レベル：1／5">${'<i class="on"></i>'.repeat(1)}${'<i></i>'.repeat(4)}</div></article>
      <article class="sk"><span class="sk-n">目Grep</span><div class="lv" role="img" aria-label="レベル：5段階の上限を超えて7">${'<i class="on"></i>'.repeat(5)}${'<i class="over"></i>'.repeat(2)}</div></article>

  <section class="sec wrap" id="legal">
    <div class="sec-head"><h2>ポリシー・お問い合わせ</h2><p class="sec-lead">お店のきまりごとです。プライバシーや利用条件などは、開くと読めます。<span lang="en">English versions are also available.</span></p>
      <div class="lang-sw" role="group" aria-label="表示する言語 / Language"><button type="button" data-lang="ja" aria-pressed="true">日本語</button><button type="button" data-lang="en" aria-pressed="false" lang="en">English</button></div></div>

</main>
<footer class="foot"><div class="wrap">
  <nav class="foot-links" aria-label="ポリシーとお問い合わせ">${LEGAL.map(d => `<a href="#${d.id}">${d.title}</a>`).join('')}<a href="#privacy-en" lang="en">Privacy Policy</a><a href="#terms-en" lang="en">Terms of Use</a></nav>
  <span>© ${SITE.year} ${SITE.name}${SITE.tld} / ${SITE.admin}</span><a href="#top">ページの先頭へ</a></div></footer>`;
};

/* ===== ヒーロー背景（Canvasで描く「文字行とマスク」） ===== */
const paintBg = () => {
  const cv = $('#bg'), box = cv.parentElement.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = rng(2026), bar = (x, y, w, h) => { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, 3) : c.rect(x, y, w, h); c.fill(); };
  for (let y = 16, row = 0; y < box.height; y += 24, row++) {
    if (row % 7 === 6) continue;
    for (let x = -r() * 40; x < box.width;) {
      const w = 14 + r() * 58, hit = r() < 0.07;
      c.globalAlpha = hit ? .3 : .07; c.fillStyle = hit ? '#F28A1E' : '#EAF4F1';
      hit ? bar(x, y - 3, w, 13) : bar(x, y, w, 6);
      x += w + 8;
    }
  }
};

/* ===== アコーディオン（ひとつ開くと、ほかは閉じる） ===== */
/* グループごとに「ひとつ開くと他は閉じる」。アプリ群とポリシー群は互いに影響しない。 */
const initAccordions = () => {
  const BASE = document.title;
  const groups = $$('.accs').map(el => ({ el, items: $$('.acc', el), def: el.dataset.default || null }));
  const all = groups.flatMap(g => g.items);
  const groupOf = id => groups.find(g => g.items.some(it => it.dataset.id === id));
  /* 規約類は「#privacy-en」のように -en を付けると英語で開く（ストア掲載用の直リンク） */
  const legalBox = $('.accs.legal'), isLegal = id => !!id && LEGAL.some(d => d.id === id);
  const setLang = en => {
    legalBox.classList.toggle('en', en);
    $$('.lang-sw button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.lang === 'en') === en));
  };
  const parse = raw => { const m = /^(.+)-(en|ja)$/.exec(raw); if (m && isLegal(m[1])) { setLang(m[2] === 'en'); return m[1]; } return raw; };
  const setHash = id => { const h = id && isLegal(id) && legalBox.classList.contains('en') ? id + '-en' : id; try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* 無視 */ } };
  const setTitle = id => { const it = all.find(x => x.dataset.id === id); document.title = it && it.dataset.title ? it.dataset.title + ' | ' + BASE : BASE; };
  const set = (g, id, { scroll = true, silent = false } = {}) => {
    g.items.forEach(it => {
      const on = it.dataset.id === id;
      it.classList.toggle('open', on);
      $('.acc-h', it).setAttribute('aria-expanded', on);
      $('.acc-p', it).inert = !on;
    });
    if (silent) return;
    setHash(id); setTitle(id);
    if (id && scroll) setTimeout(() => {
      const el = $('#' + id), top = el.getBoundingClientRect().top;
      if (top < 0 || top > innerHeight * .5) el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
    }, reduced() ? 0 : 400);
  };
  groups.forEach(g => g.items.forEach(it => $('.acc-h', it).addEventListener('click', () => set(g, it.classList.contains('open') ? null : it.dataset.id))));
  /* アプリ一覧の上のリンク：押すとそのアプリの説明を開いて、そこまで移動する */
  $$('a[data-open]').forEach(a => a.addEventListener('click', e => { const id = a.dataset.open, g = groupOf(id); if (!g) return; e.preventDefault(); set(g, id); }));
  addEventListener('hashchange', () => { const id = parse(location.hash.slice(1)), g = groupOf(id); if (g) set(g, id, { scroll: false }); });
  /* 日本語以外のブラウザでは、規約類を最初から英語で表示する */
  try { if (!/^ja/i.test((navigator.languages && navigator.languages[0]) || navigator.language || 'ja')) setLang(true); } catch (e) { /* 無視 */ }
  $$('.lang-sw button').forEach(b => b.addEventListener('click', () => {
    setLang(b.dataset.lang === 'en');
    const open = LEGAL.find(d => $('#' + d.id).classList.contains('open'));
    if (open) setHash(open.id);
  }));
  groups.forEach(g => set(g, g.def, { silent: true }));
  const start = parse(location.hash.slice(1)), sg = groupOf(start);
  if (sg) set(sg, start);
};

render();
APPS.forEach(a => a.init($('#' + a.id)));
initNews();
window.__siteReady = true;
paintBg();
initAccordions();
initMail();
if ('ResizeObserver' in window) new ResizeObserver(paintBg).observe($('#top')); else addEventListener('resize', paintBg);
})();
</script>
